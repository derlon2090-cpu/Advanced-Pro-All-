<style>
@media(min-width:901px){#dashboard.admin-pro-dashboard{width:min(1500px,calc(100% - 28px))}.ap-shell.ap-side-layout{display:grid;grid-template-columns:minmax(0,1fr) 265px;grid-template-areas:"head side" "kpis side" "panel side";gap:15px 18px;align-items:start}.ap-side-layout .ap-head{grid-area:head;margin:0}.ap-side-layout .ap-kpis{grid-area:kpis;margin:0}.ap-side-layout .ap-panel{grid-area:panel}.ap-side-layout .ap-tabs{grid-area:side;position:sticky;top:14px;display:flex;flex-direction:column;align-items:stretch;min-height:calc(100vh - 28px);margin:0;padding:12px;background:linear-gradient(180deg,#0f172a,#07101f);border-color:#253754;border-radius:19px}.ap-side-layout .ap-tab{text-align:right;padding:12px}.ap-side-layout .ap-tab.on{box-shadow:none}.ap-side-layout .ap-side-brand{display:flex}.ap-side-layout .ap-side-spacer{flex:1}.ap-side-layout #apLogout{width:100%;margin-top:12px}.ap-side-layout .ap-brand{display:none}}
.ap-side-brand{display:none;align-items:center;gap:10px;padding:5px 5px 18px;margin-bottom:7px;border-bottom:1px solid #ffffff12}.ap-side-brand .ap-brand-mark{width:42px;height:42px;flex:0 0 42px}.ap-side-brand strong{display:block;font-size:.85rem}.ap-side-brand small{color:#64748b;font-size:.65rem}.ap-tab .ap-count.hot{background:#ea580c;color:#fff}.ap-tab .ap-count.danger{background:#991b1b;color:#fecaca}.ap-overview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.ap-overview-card{padding:18px;border:1px solid #ffffff12;border-radius:16px;background:linear-gradient(145deg,#0f172a,#0a1324)}.ap-overview-card h3{margin:0 0 7px;font-size:.9rem}.ap-overview-card strong{font-size:1.8rem}.ap-overview-card p{margin:6px 0 0;color:#64748b;font-size:.72rem}.ap-renewal-days{font-size:1rem;font-weight:900;color:#fb923c}.ap-renewal-days.expired{color:#fca5a5}.ap-auto-card{margin-top:16px;border-color:#c2410c66}.ap-side-backdrop{display:none}.ap-menu-toggle{display:none}
@media(max-width:900px){.ap-menu-toggle{display:inline-flex}.ap-tabs.ap-mobile-side{position:fixed;z-index:70;top:0;right:0;width:min(285px,86vw);height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:stretch;margin:0;padding:14px;background:#07101f;border-radius:0;transform:translateX(105%);transition:.22s;overflow:auto}.ap-tabs.ap-mobile-side.open{transform:none}.ap-mobile-side .ap-side-brand{display:flex}.ap-mobile-side .ap-tab{text-align:right}.ap-mobile-side .ap-side-spacer{flex:1}.ap-mobile-side #apLogout{width:100%;margin-top:12px}.ap-side-backdrop{position:fixed;z-index:69;inset:0;background:#020617bf;backdrop-filter:blur(3px)}.ap-side-backdrop.open{display:block}.ap-overview-grid{grid-template-columns:1fr}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!location.pathname.startsWith('/admin'))return;
  var cache=null,busy=false;
  var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var fmt=function(v){if(!v)return'—';try{return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeZone:'Asia/Riyadh'}).format(new Date(v))}catch(e){return'—'}};
  var signedDays=function(v){return v?Math.ceil((new Date(v)-Date.now())/86400000):9999};
  var customer=function(o){var c=Array.isArray(o.customers)?o.customers[0]:o.customers;return c&&c.name||'عميل سلة'};
  async function getData(force){if(cache&&!force)return cache;var r=await fetch('/api/admin/operations'),d=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(d.message||'تعذر تحميل البيانات');(d.orders||[]).forEach(function(o){o.customer_email=o.reminder_email||o.customer_email});cache=d;return d}
  function closeSide(){document.querySelector('.ap-mobile-side')?.classList.remove('open');document.getElementById('apSideBackdrop')?.classList.remove('open')}
  async function decorate(){
    var shell=document.querySelector('.ap-shell'),tabs=shell&&shell.querySelector('.ap-tabs');if(!shell||!tabs||tabs.dataset.sideReady||busy)return;busy=true;
    try{var d=await getData();tabs.dataset.sideReady='1';shell.classList.add('ap-side-layout');tabs.classList.add('ap-mobile-side');
      var expiring=(d.orders||[]).filter(function(o){var n=signedDays(o.expires_at);return n<=5&&n>=-30}).length,security=(d.orders||[]).filter(function(o){return Number(o.security_strikes)>0}).length+(d.mailSecurityEvents||[]).length;
      tabs.insertAdjacentHTML('afterbegin','<div class="ap-side-brand"><div class="ap-brand-mark">AP</div><div><strong>بوابة أدفانسد برو</strong><small>مركز الإدارة والتشغيل</small></div></div><button class="ap-tab" data-side-custom="overview">⌂ نظرة عامة</button>');
      var orders=tabs.querySelector('[data-tab="orders"]');orders&&orders.insertAdjacentHTML('afterend','<button class="ap-tab" data-side-custom="renewals">↻ قرب الانتهاء والتجديدات <span class="ap-count hot">'+expiring+'</span></button>');
      tabs.querySelector('[data-tab="security"] .ap-count')?.classList.toggle('danger',security>0);
      tabs.insertAdjacentHTML('beforeend','<div class="ap-side-spacer"></div>');var logout=document.getElementById('apLogout');logout&&tabs.append(logout);
      var head=document.querySelector('.ap-head .ap-actions');head&&head.insertAdjacentHTML('afterbegin','<button id="apMenuToggle" class="ap-btn ap-menu-toggle">☰ القائمة</button>');document.body.insertAdjacentHTML('beforeend','<div id="apSideBackdrop" class="ap-side-backdrop"></div>');
      document.getElementById('apMenuToggle').onclick=function(){tabs.classList.add('open');document.getElementById('apSideBackdrop').classList.add('open')};document.getElementById('apSideBackdrop').onclick=closeSide;
      tabs.querySelectorAll('.ap-tab').forEach(function(button){button.addEventListener('click',function(){closeSide()})});
      tabs.querySelector('[data-side-custom="overview"]').onclick=function(){activate(this);renderOverview(d)};
      tabs.querySelector('[data-side-custom="renewals"]').onclick=function(){activate(this);renderRenewals(d)};
      activate(tabs.querySelector('[data-side-custom="overview"]'));renderOverview(d);
    }catch(e){}finally{busy=false}
  }
  function activate(button){document.querySelectorAll('.ap-tab').forEach(function(x){x.classList.toggle('on',x===button)})}
  function panel(){return document.getElementById('apPanel')}
  function renderOverview(d){var orders=d.orders||[],active=orders.filter(function(o){return['delivered','active'].includes(o.status)}).length,exp=orders.filter(function(o){var n=signedDays(o.expires_at);return n<=5&&n>=0}).length,security=orders.filter(function(o){return Number(o.security_strikes)>0}).length+(d.mailSecurityEvents||[]).length,available=(d.capacity||[]).reduce(function(n,x){return n+Number(x.available_slots||0)},0);panel().innerHTML='<div class="ap-section-head"><div><h2>نظرة عامة</h2><p>ملخص يومي سريع لحالة المنصة والإجراءات ذات الأولوية.</p></div></div><div class="ap-overview-grid"><article class="ap-overview-card"><h3>الطلبات النشطة</h3><strong>'+active+'</strong><p>اشتراكات قيد الخدمة الآن</p></article><article class="ap-overview-card"><h3>تنتهي خلال 5 أيام</h3><strong style="color:#fb923c">'+exp+'</strong><p>تحتاج متابعة التجديد</p></article><article class="ap-overview-card"><h3>تنبيهات الأمان</h3><strong style="color:'+(security?'#fca5a5':'#6ee7b7')+'">'+security+'</strong><p>مخالفات أجهزة وتنبيهات بريد</p></article><article class="ap-overview-card"><h3>المقاعد المتاحة</h3><strong>'+available+'</strong><p>متاحة لتسكين طلبات جديدة</p></article></div>'}
  function reminderState(o){var sent=o.renewal_reminder_1d_sent_at||o.renewal_reminder_3d_sent_at||o.renewal_reminder_manual_sent_at,enabled=o.reminder_email||o.customer_email;return sent?'<span class="ap-badge good">تم الإرسال · '+fmt(sent)+'</span>':enabled?'<span class="ap-badge good">التذكير مفعّل</span>':'<span class="ap-badge orange">غير مفعّل</span>'}
  function renderRenewals(d){var rows=(d.orders||[]).filter(function(o){var n=signedDays(o.expires_at);return n<=5&&n>=-30}).sort(function(a,b){return new Date(a.expires_at)-new Date(b.expires_at)}),s=d.settings||{};panel().innerHTML='<div class="ap-section-head"><div><h2>قرب الانتهاء والتجديدات</h2><p>الاشتراكات المتبقي عليها 5 أيام أو أقل والمنتهية خلال آخر 30 يومًا.</p></div><button id="apRenewRefresh" class="ap-btn">↻ تحديث القائمة</button></div><div class="ap-scroll"><table class="ap-table"><thead><tr><th>الطلب والعميل</th><th>التواصل</th><th>المنتج</th><th>المتبقي</th><th>حالة الإشعار</th><th>الإجراء</th></tr></thead><tbody>'+((rows.map(function(o){var n=signedDays(o.expires_at);return'<tr><td><span class="ap-order">#'+esc(o.order_number)+'</span><span class="ap-sub">'+esc(customer(o))+'</span></td><td>'+esc(o.customer_email||o.customer_phone||'غير مسجل')+'</td><td>'+esc(o.product_name||o.service_type||'—')+'</td><td><span class="ap-renewal-days '+(n<=0?'expired':'')+'">'+(n>0?n+' يوم':n===0?'ينتهي اليوم':'منتهي منذ '+Math.abs(n)+' يوم')+'</span></td><td>'+reminderState(o)+'</td><td><button class="ap-btn small primary" data-renew-send="'+o.id+'" '+(!o.customer_email?'disabled title="لا يوجد بريد للعميل"':'')+'>إرسال إشعار الآن</button></td></tr>'}).join(''))||'<tr><td colspan="6" class="ap-empty">لا توجد اشتراكات قريبة الانتهاء.</td></tr>')+'</tbody></table></div><section class="ap-card ap-auto-card"><h3>الإرسال التلقائي</h3><label class="ap-check"><input id="apAutoRenewal" type="checkbox" '+(s.renewal_reminders_enabled?'checked':'')+'> تفعيل تنبيهات التجديد اليومية</label><div class="ap-row-actions" style="margin-top:12px"><label class="ap-check"><input id="apDay3" type="checkbox" '+((s.renewal_reminder_days||[3,1]).includes(3)?'checked':'')+'> قبل 3 أيام</label><label class="ap-check"><input id="apDay1" type="checkbox" '+((s.renewal_reminder_days||[3,1]).includes(1)?'checked':'')+'> قبل يوم واحد</label><button id="apSaveRenewalSettings" class="ap-btn primary">حفظ سياسة التنبيهات</button></div><p id="apRenewalMessage" class="ap-result"></p></section>';
    panel().querySelectorAll('[data-renew-send]').forEach(function(b){b.onclick=function(){sendNow(b.dataset.renewSend,b)}});document.getElementById('apSaveRenewalSettings').onclick=saveRenewalSettings;document.getElementById('apRenewRefresh').onclick=async function(){cache=await getData(true);renderRenewals(cache)}}
  async function sendNow(id,button){var old=button.textContent;button.disabled=true;button.textContent='جارِ الإرسال…';try{var r=await fetch('/api/admin/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'send_renewal_reminder',orderId:id})}),q=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(q.message||'تعذر الإرسال');button.textContent='تم الإرسال ✓';cache=await getData(true);setTimeout(function(){renderRenewals(cache)},900)}catch(e){button.disabled=false;button.textContent=old;alert(e.message)}}
  async function saveRenewalSettings(){var msg=document.getElementById('apRenewalMessage'),days=[];if(document.getElementById('apDay3').checked)days.push(3);if(document.getElementById('apDay1').checked)days.push(1);msg.textContent='جارِ الحفظ…';var r=await fetch('/api/admin/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'save_renewal_settings',settings:{renewal_reminders_enabled:document.getElementById('apAutoRenewal').checked,renewal_reminder_days:days}})}),q=await r.json().catch(function(){return{}});msg.textContent=r.ok?'تم حفظ سياسة التنبيهات.':(q.message||'تعذر الحفظ');if(r.ok)cache=await getData(true)}
  function enhanceProducts(){var form=document.getElementById('apMappingForm');if(!form||form.dataset.renewEnhanced)return;form.dataset.renewEnhanced='1';var ack=form.querySelector('textarea[name="ack"]')?.closest('label');ack?.insertAdjacentHTML('beforebegin','<label class="ap-field">كود خصم التجديد<input name="discountCode" class="ap-input" maxlength="80" placeholder="RENEW10"></label>');form.onsubmit=async function(e){e.preventDefault();var f=e.currentTarget,r=document.getElementById('apMappingResult');r.textContent='جارِ الحفظ…';var x=await fetch('/api/admin/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'save_mapping',mapping:{salla_product_id:f.productId.value,product_title:f.title.value,service_type:f.service.value,duration_days:f.duration.value,has_warranty:f.warranty.checked,warranty_days:f.warrantyDays.value,renewal_url:f.renewalUrl.value,renewal_discount_code:f.discountCode.value,acknowledgment_text:f.ack.value}})}),q=await x.json().catch(function(){return{}});if(x.ok){r.textContent='تم الحفظ بنجاح.';cache=null;document.getElementById('apRefresh').click()}else r.textContent=q.message||'تعذر الحفظ'} }
  function enhanceSettings(){var form=document.getElementById('apSettingsForm');if(!form||form.dataset.renewEnhanced)return;form.dataset.renewEnhanced='1';var s=cache&&cache.settings||{};form.insertAdjacentHTML('afterend','<section class="ap-card ap-auto-card"><h3>تنبيهات التجديد التلقائية</h3><p class="ap-note">يرسل النظام رسالة واحدة لكل مرحلة، ويتجنب تكرار البريد تلقائيًا.</p><label class="ap-check"><input id="apAutoRenewal" type="checkbox" '+(s.renewal_reminders_enabled?'checked':'')+'> تفعيل التنبيهات اليومية</label><div class="ap-row-actions" style="margin-top:12px"><label class="ap-check"><input id="apDay3" type="checkbox" '+((s.renewal_reminder_days||[3,1]).includes(3)?'checked':'')+'> قبل 3 أيام</label><label class="ap-check"><input id="apDay1" type="checkbox" '+((s.renewal_reminder_days||[3,1]).includes(1)?'checked':'')+'> قبل يوم واحد</label><button id="apSaveRenewalSettings" class="ap-btn primary" type="button">حفظ سياسة التنبيهات</button></div><p id="apRenewalMessage" class="ap-result"></p></section>');document.getElementById('apSaveRenewalSettings').onclick=saveRenewalSettings}
  var observer=new MutationObserver(function(){decorate();enhanceProducts();enhanceSettings()});observer.observe(document.body,{childList:true,subtree:true});decorate();enhanceSettings();
});
</script>
