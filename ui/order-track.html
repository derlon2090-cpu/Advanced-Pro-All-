ontent='عرض الطلب ←'}};requestAnimationFrame(()=>input.focus())};

      const offer = actions.upsellOffer;
      const upsellCard = offer?.url && offer?.expiresAt

      const order = payload.order || {};
      const points = String(order.acknowledgment_text || 'يرجى الالتزام بشروط استخدام المنتج وعدم مشاركة بياناته.').split(/\r?\n/).map(value => value.trim()).filter(Boolean);
      portal.innerHTML = shell('<article class="digital-order device-card step-ack"><div class="device-icon">⌾</div><h1>إقرار وسياسة الضمان</h1><p>تمت مطابقة الجهاز. بقي توثيق موافقتك قبل كشف بيانات الاشتراك الحساسة.</p><section class="ack-box"><ul class="ack-list">'+points.map(point=>'<li>'+escapeHtml(point)+'</li>').join('')+'</ul><div class="ack-control"><label class="ack-check"><input id="stageAckCheckbox" type="checkbox"> <span>أقرّ بقراءة شروط المنتج وسياسة الضمان وأوافق عليها</span></label><button id="stageAckButton" class="ack-button" type="button" disabled>أوافق وأُوثّق جهازي الآن ✓</button><p id="stageAckMessage" class="ack-message" role="status"></p></div></section></article>');
      const checkbox=document.getElementById('stageAckCheckbox'),button=document.getElementById('stageAckButton'),message=document.getElementById('stageAckMessage');
      checkbox.onchange=()=>{button.disabled=!checkbox.checked;message.textContent=''};
      button.onclick=async()=>{if(!checkbox.checked)return;button.disabled=true;button.textContent='جارِ توثيق الإقرار…';try{const response=await fetch('/api/public/track?token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,accepted:true})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.message||'تعذر توثيق الإقرار.');showVerified(result)}catch(error){message.textContent=error.message;button.disabled=false;button.textContent='أوافق وأُوثّق جهازي الآن ✓'}};
    };
    const enterVerified = async payload => {
      if (!payload?.order?.device_verified) throw new Error('تعذر توثيق الجهاز لهذا الطلب.');
      if (!payload.order.acknowledged_at) return showAcknowledgment(payload);
      showVerified();
    };
    const startVerification = async () => {
      showScanning();
      try {
        const { collectDeviceDna } = await import('/lib/device-dna.js');
        const dna = await collectDeviceDna();
        const { response, result: security } = await verifyDevice('verify', dna);
        if (response.ok && security.allowed) return enterVerified(await loadOrder());
        if (security.transferRequired) return showTransfer(security, dna);
        if (security.locked) return showLocked(security);
        if (security.state === 'device_mismatch_strike') return showStrike(security);
        throw new Error(security.message || 'تعذر التحقق من الجهاز.');
      } catch (error) {
        portal.innerHTML = shell('<div class="digital-order track-error"><strong>تعذر عرض الطلب</strong>' + escapeHtml(error.message) + '<br><br><a href="/">العودة إلى الاستعلام</a></div>');
      }
    };
    const showFound = payload => {
      const order=payload.order||{};
      portal.innerHTML='<main class="progressive-found"><section class="found-card"><div class="found-check">✓</div><h1>تم العثور على طلبك بنجاح!</h1><p>طلبك موثّق وجاهز لبدء التحقق الأمني.</p><div class="found-summary"><strong>طلب #'+escapeHtml(order.order_number||'—')+'</strong><span>'+escapeHtml(order.product_name||'اشتراك رقمي')+'</span><span class="salla-found">طلب موثّق من سلة ✓</span></div><button id="continueToDevice" class="found-continue" type="button">المتابعة للتحقق من الجهاز ←</button><small class="found-auto">سيتم الانتقال تلقائيًا خلال لحظات</small></section></main>';
      let continued=false;const proceed=()=>{if(continued)return;continued=true;startVerification()};
      document.getElementById('continueToDevice').onclick=proceed;
      setTimeout(proceed,1800);
    };
    portal.innerHTML='<main class="order-portal"><div class="track-loading"><span class="track-spinner"></span><strong>جارِ البحث عن طلبك…</strong><small>لحظات ونجهز رحلة التحقق الآمنة</small></div></main>';
    loadOrder().then(showFound).catch(error=>{portal.innerHTML='<main class="order-portal"><div class="track-error"><strong>تعذر عرض الطلب</strong>'+escapeHtml(error.message)+'<br><br><a href="/">العودة إلى الاستعلام</a></div></main>'});
  });
</script>
