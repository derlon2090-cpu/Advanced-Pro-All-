</style>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (!location.pathname.startsWith('/track/')) return;
    if (await window.apMaintenanceGate?.()) return;
    const portal = document.getElementById('portal');
    if (!portal) return;
    document.body.classList.add('order-track-ready');
    const token = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const date = value => value ? new Intl.DateTimeFormat('ar-SA', { dateStyle: 'medium', timeZone: 'Asia/Riyadh' }).format(new Date(value)) : '—';
    const dateTime = value => value ? new Intl.DateTimeFormat('ar-SA', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Riyadh' }).format(new Date(value)) : '—';
    const daysLeft = value => value ? Math.max(0, Math.ceil((new Date(value) - Date.now()) / 86400000)) : 0;
    const copyButton = (value, label = 'نسخ', activity = '') => '<button class="copy-button" type="button" data-copy="' + escapeHtml(value) + '" data-copy-label="' + escapeHtml(label) + '"' + (activity ? ' data-copy-activity="' + escapeHtml(activity) + '"' : '') + ' aria-label="نسخ ' + escapeHtml(label) + '">⧉ ' + escapeHtml(label) + '</button>';
    const bindCopyButtons = () => document.querySelectorAll('[data-copy]').forEach(button => {
      button.onclick = async () => {
        const value = button.dataset.copy || '';
        try {
          if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(value);
          else { const field = document.createElement('textarea'); field.value = value; field.style.position = 'fixed'; field.style.opacity = '0'; document.body.append(field); field.select(); document.execCommand('copy'); field.remove(); }
          if (button.dataset.copyActivity) fetch('/api/public/activity', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, activity: button.dataset.copyActivity }), keepalive: true }).catch(() => {});
          const original = button.innerHTML; button.classList.add('copied'); button.textContent = '✓ تم النسخ';
          setTimeout(() => { button.classList.remove('copied'); button.innerHTML = original; }, 1800);
        } catch { button.textContent = 'تعذر النسخ'; }
      };
    });
    const statusInfo = order => {
      const value = String(order.salla_status || order.status || '').toLowerCase();
      if (value === 'expired' || (order.expires_at && new Date(order.expires_at) <= new Date())) return { label:'انتهت مدة الاشتراك', cls:'expired', active:false, expired:true };
      if (['delivered','follow_up_complete','completed','active','تم التنفيذ'].includes(value)) return { label:'تم التنفيذ • بدأ سريان الاشتراك ✓', cls:'', active:true, expired:false };
      return { label:'قيد التنفيذ • سيبدأ احتساب المدة فور التفعيل', cls:'pending', active:false, expired:false };
    };
    const render = payload => {
      const order = payload.order, actions = payload.actions || {};
      if (!order.device_verified) throw new Error('تعذر توثيق الجهاز لهذا الطلب.');
      const state = statusInfo(order), statusLabel=state.label, statusClass=state.cls;
      const remaining = daysLeft(order.expires_at), warrantyRemaining = daysLeft(order.warranty_expires_at);
      const started = order.starts_at ? new Date(order.starts_at).getTime() : Date.now();
      const ending = order.expires_at ? new Date(order.expires_at).getTime() : started;
      const elapsedProgress = ending > started ? Math.max(0, Math.min(100, ((Date.now() - started) / (ending - started)) * 100)) : 0;
      const remainingProgress = state.active ? Math.max(0,100-elapsedProgress) : state.expired ? 0 : 100;
      const warrantyActive = order.has_warranty && warrantyRemaining > 0;
      const warranty = !order.has_warranty
        ? { cls: 'off', title: 'بدون ضمان (تسليم لمرة واحدة)', text: 'تم تسليم هذا المنتج مرة واحدة ولا يشمله التعويض بعد التسليم.' }
        : warrantyActive
          ? { cls: '', title: 'مشمول بالضمان — متبقي ' + warrantyRemaining + ' يوم', text: 'يشمل الضمان التعويض عند التوقف غير الناتج عن مخالفة شروط المنتج.' }
          : { cls: 'expired', title: 'انتهت فترة الضمان', text: 'انتهت مدة التغطية المحددة لهذا الطلب.' };
      const points = String(order.acknowledgment_text || 'يرجى الالتزام بشروط استخدام المنتج وعدم مشاركة بياناته.').split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      const acknowledged = Boolean(order.acknowledged_at);
      const crunchyUrl = actions.crunchyrollPortalUrl || '';
      const supportText = encodeURIComponent('مرحبًا، أطلب دعم الضمان للطلب #' + order.order_number + ' — المنتج: ' + (order.product_name || 'اشتراك رقمي'));
      const supportUrl = 'https://wa.me/' + (actions.supportWhatsapp || '') + '?text=' + supportText;
      const accountCard = order.account_email ? '<section class="account-card"><h2>بيانات الاشتراك</h2><div class="account-line"><div><span>البريد الإلكتروني</span><strong>' + escapeHtml(order.account_email) + '</strong></div>' + copyButton(order.account_email, 'نسخ البريد', 'account_email_copied') + '</div></section>' : '';
      const renewalUrl = order.renewal_url || actions.renewalStoreUrl || '';
      const renewalCard = renewalUrl && remaining <= 5 ? '<section class="renewal-card urgent"><h2>' + (remaining > 0 ? 'اشتراكك ينتهي خلال ' + remaining + ' أيام' : 'انتهى اشتراكك') + '</h2><p>جدّد الآن لتفادي انقطاع الخدمة.</p>' + (order.renewal_discount_code ? '<div class="discount-row"><span>كود خصم خاص: <strong>' + escapeHtml(order.renewal_discount_code) + '</strong></span>' + copyButton(order.renewal_discount_code, 'نسخ الكود') + '</div>' : '') + '<a class="renewal-button" target="_blank" rel="noopener" href="' + escapeHtml(renewalUrl) + '">جدّد اشتراكك الآن بضغطة واحدة ↗</a></section>' : '';
      const reminderCard = '<section class="reminder-card"><h2>تذكير التجديد الذكي عبر البريد الإلكتروني</h2><p>' + (order.reminder_email_masked ? 'سيصلك تذكير تلقائي قبل انتهاء اشتراكك على: <strong>' + escapeHtml(order.reminder_email_masked) + '</strong>. يمكنك إدخال بريد جديد لتغييره.' : 'أضف بريدك الإلكتروني ليصلك رابط اشتراكك الآن، وتنبيه تلقائي قبل انتهاء الاشتراك مع رابط التجديد المباشر.') + '</p><form id="reminderEmailForm" class="reminder-form"><input id="reminderEmailInput" type="email" maxlength="254" required autocomplete="email" placeholder="name@example.com"><button type="submit">' + (order.reminder_email_masked ? 'تغيير الإيميل' : 'تفعيل التذكير') + '</button></form><p id="reminderEmailStatus" class="reminder-status" role="status"></p>' + (renewalUrl ? '<a class="renewal-button" target="_blank" rel="noopener" href="' + escapeHtml(renewalUrl) + '">تجديد الاشتراك الآن ↗</a>' : '') + '</section>';
      const positiveAction = actions.sallaReviewUrl ? '<a class="positive" target="_blank" rel="noopener" href="' + escapeHtml(actions.sallaReviewUrl) + '">نعم، كانت رائعة ⭐</a>' : '<button class="positive" type="button" data-feedback-positive>نعم، كانت رائعة ⭐</button>';
      const feedbackCard = '<section class="feedback-card"><h2>هل كانت تجربة استلام طلبك سريعة؟</h2><p>رأيك يساعدنا على تحسين الخدمة.</p><div class="feedback-actions">' + positiveAction + '<a target="_blank" rel="noopener" href="' + supportUrl + '">واجهت مشكلة — تواصل معنا</a></div><p id="feedbackThanks" class="feedback-thanks" hidden>شكرًا لك، سعداء بخدمتك ✓</p></section>';
      const timingSummary = state.active ? 'اشتراكك سارٍ حاليًا — متبقي '+remaining+' يوم' : state.expired ? 'اكتملت مدة الاشتراك — يمكنك التجديد الآن' : 'مدة اشتراكك محفوظة بالكامل ولن تُحتسب إلا لحظة التنفيذ';
      portal.innerHTML = '<main class="order-portal"><section class="track-hero"><header class="order-brand"><div><strong>بوابة أدفانسد برو</strong><small>Advanced Pro Portal</small></div><a href="/">← استعلام عن طلب آخر</a></header><div class="track-hero-copy"><span class="order-number copy-inline">طلب #' + escapeHtml(order.order_number) + ' ' + copyButton(order.order_number, 'نسخ الرقم') + '</span><h1>' + escapeHtml(order.product_name || 'اشتراك رقمي') + '</h1><span class="state-badge ' + statusClass + '">' + statusLabel + '</span><span class="track-service">' + escapeHtml(order.service_type === 'crunchyroll' ? 'Crunchyroll' : order.service_type === 'chatgpt' ? 'ChatGPT' : 'منتج رقمي') + '</span></div></section><section class="track-night"><div class="order-wrap"><article class="digital-order"><div class="ticket-body"><section class="time-grid"><div class="time-cell"><span>'+(state.active?'تاريخ التنفيذ وبداية السريان':'موعد بداية احتساب الاشتراك')+'</span><strong>' + (state.active?dateTime(order.starts_at):'عند اكتمال التنفيذ') + '</strong></div><div class="time-cell"><span>تاريخ الانتهاء</span><strong>' + (state.active||state.expired?date(order.expires_at):'يُحسب بعد التنفيذ') + '</strong></div><div class="time-cell"><span>المدة</span><strong>' + escapeHtml(order.duration_days || 30) + ' يوم</strong></div><div class="time-cell subscription-summary '+statusClass+'"><span>حالة مدة الاشتراك</span><strong>'+timingSummary+'</strong><div class="progress" aria-label="نسبة المدة المتبقية"><i style="width:' + remainingProgress.toFixed(1) + '%"></i></div></div></section><section class="warranty-card ' + warranty.cls + '"><h2>✦ ' + warranty.title + '</h2><p>' + warranty.text + '</p></section><section class="ack-box"><h2>إقرار وسياسة المنتج</h2><ul class="ack-list">' + points.map(point => '<li>' + escapeHtml(point) + '</li>').join('') + '</ul><div id="ackArea">' + (acknowledged ? '<div class="ack-stamp">✓ تم توثيق الإقرار بتاريخ ' + date(order.acknowledged_at) + ' وحمايته ببصمة الجهاز الفيزيائية</div>' : '<div class="ack-control"><label class="ack-check"><input id="ackCheckbox" type="checkbox"> <span>أقرّ بقراءة وموافقة شروط وسياسة المنتج أعلاه</span></label><button id="ackButton" class="ack-button" type="button" disabled>تأكيد الإقرار وعرض تفاصيل الاشتراك</button><p id="ackMessage" class="ack-message" role="status"></p></div>') + '</div></section><section id="orderActions" class="order-actions"' + (acknowledged ? '' : ' hidden') + '>' + (order.service_type === 'crunchyroll' ? '<a class="crunchy-action" href="' + escapeHtml(crunchyUrl) + '">الانتقال لبوابة دخول كرانشي رول واستلام رمز الموافقة</a>' : '') + (warrantyActive ? '<a class="support-action" target="_blank" rel="noopener" href="' + supportUrl + '">طلب دعم / تعويض الضمان (واتساب)</a>' : '') + '</section>' + (acknowledged ? '<div class="post-ack">' + accountCard + renewalCard + reminderCard + feedbackCard + '</div>' : '') + '</div></article></div></section></main>';
      const card = portal.querySelector('.digital-order');
      if (card) card.insertAdjacentHTML('afterbegin', '<div class="order-watermark" aria-hidden="true">' + Array.from({ length: 15 }, () => '<span>ORDER #' + escapeHtml(order.order_number) + '</span>').join('') + '</div>');
      portal.querySelector('.track-service')?.insertAdjacentHTML('afterend', '<span class="salla-verified">تم التحقق من متجر سلة ✓</span>');
      if (order.service_type === 'crunchyroll' && !crunchyUrl) {
        const action = portal.querySelector('.crunchy-action');
        if (action) action.outerHTML = '<p class="ack-message">بوابة Crunchyroll غير مهيأة حاليًا. تواصل مع الدعم لإكمال التفعيل.</p>';
      }
      bindCopyButtons();
      const reminderForm = document.getElementById('reminderEmailForm');
      if (reminderForm) reminderForm.onsubmit = async event => {
        event.preventDefault(); const input = document.getElementById('reminderEmailInput'), status = document.getElementById('reminderEmailStatus'), button = reminderForm.querySelector('button');
        button.disabled = true; button.textContent = 'جارِ التفعيل…'; status.textContent = '';
        try { const response = await fetch('/api/public/track/' + encodeURIComponent(token) + '/reminder-email', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: input.value.trim() }) }); const result = await response.json().catch(() => ({})); if (!response.ok) throw new Error(result.message || 'تعذر تفعيل التذكير.'); status.textContent = 'تم تفعيل التذكير بنجاح! أرسلنا نسخة من رابط اشتراكك ورابط التجديد إلى بريدك الإلكتروني الآن.'; input.value = ''; button.textContent = 'تم التفعيل ✓'; }
        catch (error) { status.textContent = error.message; button.disabled = false; button.textContent = order.reminder_email_masked ? 'تغيير الإيميل' : 'تفعيل التذكير'; }
      };
      const positiveFeedback = document.querySelector('[data-feedback-positive]');
      if (positiveFeedback) positiveFeedback.onclick = () => { positiveFeedback.hidden = true; document.getElementById('feedbackThanks').hidden = false; };
      if (!acknowledged) {
        const checkbox = document.getElementById('ackCheckbox'), button = document.getElementById('ackButton'), message = document.getElementById('ackMessage');
        checkbox.onchange = () => { button.disabled = !checkbox.checked; message.textContent = ''; };
        button.onclick = async () => {
          if (!checkbox.checked) return;
          button.disabled = true; button.textContent = 'جارِ توثيق الإقرار…';
          try {
            const response = await fetch('/api/public/track?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, accepted: true }) });
            const result = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(result.message || 'تعذر توثيق الإقرار.');
            render(result);
          } catch (error) {
            message.textContent = error.message; button.disabled = false; button.textContent = 'تأكيد الإقرار وعرض تفاصيل الاشتراك';
          }
        };
      }
    };
    const shell = content => '<main class="order-portal"><section class="track-hero"><header class="order-brand"><div><strong>بوابة أدفانسد برو</strong><small>حماية الاشتراك بجهاز واحد</small></div><a href="/">← العودة للاستعلام</a></header><div class="track-hero-copy"><span class="order-number">بوابة الطلب الآمنة</span><h1>التحقق من الجهاز</h1></div></section><section class="track-night"><div class="order-wrap">' + content + '</div></section></main>';
    const loadOrder = () => fetch('/api/public/track?token=' + encodeURIComponent(token), { headers: { accept: 'application/json' } })
      .then(async response => { const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.message || 'تعذر تحميل الطلب.'); return data; })
      .then(render);
    const verifyDevice = async (action, dna) => {
      const challengeResponse = await fetch('/api/public/verify-device', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, action: 'challenge' }) });
      const challengePayload = await challengeResponse.json().catch(() => ({}));
      if (!challengeResponse.ok || !challengePayload.challenge) throw new Error(challengePayload.message || 'تعذر إنشاء التحدي الأمني.');
      const response = await fetch('/api/public/verify-device', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, action, challenge: challengePayload.challenge, ...dna }) });
      return { response, result: await response.json().catch(() => ({})) };
    };
    const showTransfer = (security, dna) => {
      portal.innerHTML = shell('<article class="digital-order device-card"><div class="device-icon">↻</div><h1>يبدو أنك تستخدم جهازًا جديدًا</h1><p>نرحب بك! لاحظنا أن هذا الجهاز مختلف عن جهازك السابق (<strong>' + escapeHtml(security.oldDeviceName || 'جهازك السابق') + '</strong>). إذا قمت بتغيير جهازك، يمكنك اعتماد هذا الجهاز الجديد مجانًا لمرة واحدة.</p><p class="device-note">لن نسجل أي مخالفة عند النقل. بعد اعتماده يصبح الجهاز السابق غير معتمد، ويتبقى لك ' + Math.max(0, Number(security.freeResetsRemaining) || 0) + ' فرصة نقل.</p><button id="deviceTransfer" class="device-transfer" type="button">اعتماد هذا الجهاز كجهازي الأساسي</button><p id="deviceTransferMessage" class="ack-message" role="status"></p></article>');
      const button = document.getElementById('deviceTransfer'), message = document.getElementById('deviceTransferMessage');
      button.onclick = async () => {
        button.disabled = true; button.textContent = 'جارِ اعتماد الجهاز…'; message.textContent = '';
        try {
          const { response, result } = await verifyDevice('transfer', dna);
          if (!response.ok || !result.allowed) throw new Error(result.message || 'تعذر نقل الجهاز.');
          await loadOrder();
        } catch (error) { message.textContent = error.message; button.disabled = false; button.textContent = 'اعتماد هذا الجهاز كجهازي الأساسي'; }
      };
    };
    const showLocked = security => {
      const reason = security.message || 'تم رصد مخالفتين مؤكدتين لبصمة الجهاز.';
      portal.innerHTML = shell('<article class="digital-order device-card device-lock"><div class="device-icon">!</div><h1>تم إيقاف الوصول لحماية الاشتراك</h1><p>' + reason + '</p><p class="device-note">إذا كنت صاحب الطلب وتعتقد أن هذا الإجراء غير صحيح، تواصل مع الدعم لمراجعة الحالة يدويًا.</p></article>');
    };
    const showStrike = security => portal.innerHTML = shell('<article class="digital-order device-card"><div class="device-icon">!</div><h1>تم رفض هذا الجهاز</h1><p>' + escapeHtml(security.message || 'الجهاز لا يطابق الجهاز المعتمد.') + '</p><p class="device-note">لم يتم قفل الطلب بعد. يتم القفل بعد مخالفتين مؤكدتين.</p></article>');
    portal.innerHTML = shell('<div class="digital-order track-loading"><span class="track-spinner"></span><strong>جارِ تجهيز تفاصيل طلبك…</strong><small>نتحقق من حماية الجهاز وحالة الاشتراك</small></div>');
    (async () => {
      try {
        const { collectDeviceDna } = await import('/lib/device-dna.js');
        const dna = await collectDeviceDna();
        const { response, result: security } = await verifyDevice('verify', dna);
        if (response.ok && security.allowed) return loadOrder();
        if (security.transferRequired) return showTransfer(security, dna);
        if (security.locked) return showLocked(security);
        if (security.state === 'device_mismatch_strike') return showStrike(security);
        throw new Error(security.message || 'تعذر التحقق من الجهاز.');
      } catch (error) {
        portal.innerHTML = shell('<div class="digital-order track-error"><strong>تعذر عرض الطلب</strong>' + escapeHtml(error.message) + '<br><br><a href="/">العودة إلى الاستعلام</a></div>');
      }
    })();
  });
</script>
