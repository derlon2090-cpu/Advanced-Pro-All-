<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!location.pathname.startsWith('/admin')) return;
  var state={data:null,tab:'overview',query:'',orderStatus:'',reviewFilter:'all',compensationFilter:'all'};
  var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var fmt=function(v){if(!v)return '—';try{return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeZone:'Asia/Riyadh'}).format(new Date(v))}catch(e){return '—'}};
  var days=function(v){return v?Math.max(0,Math.ceil((new Date(v)-Date.now())/86400000)):0};
  var account=function(o){var a=o.account_assignments&&o.account_assignments[0];return a&&a.email_accounts||null};
  var customer=function(o){var c=Array.isArray(o.customers)?o.customers[0]:o.customers;return c&&c.name||'عميل سلة'};
  var reputationBadge=function(o){var r=o&&o.customer_reputation||{},labels={trusted:['trusted','✓ عميل موثوق'],repeat_flag:['repeat','! تكرار مع مخالفات'],high_risk_repeat:['high','⚠ عالي الخطورة'],name_match:['name','≈ تشابه اسم']},x=labels[r.badge];if(!x)return '';var title=r.badge==='name_match'?'تشابه اسم فقط دون تطابق جوال أو بريد أو جهاز — لا يسبب حظرًا':Number(r.total_orders||1)+' طلبات • '+Number(r.cumulative_strikes||0)+' مخالفات تراكمية • '+Number(r.cumulative_compensations||0)+' تعويضات';return '<span class="ap-reputation '+x[0]+'" title="'+esc(title)+'">'+x[1]+'</span>'};
  var toast=function(message,error){var t=document.getElementById('apToast');if(!t)return;t.textContent=message;t.className='ap-toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.className='ap-toast'},3000)};
  var api=async function(url,options){var r=await fetch(url,options),d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.message||'تعذر إكمال العملية.');return d};
  var host=function(){var h=document.getElementById('dashboard');return h&&h.classList.contains('show')?h:null};
  async function load(){
    var h=host();if(!h)return false;
    document.body.classList.add('admin-pro-mode');h.className='dash show admin-pro-dashboard';
    h.innerHTML='<div class="ap-loading"><div><div class="ap-spinner"></div><strong>جارِ تحميل بيانات التشغيل…</strong><p class="ap-note">يتم الاتصال بقاعدة البيانات الآمنة</p></div></div>';
    try{state.data=await api('/api/admin/operations');renderShell(h);return true}catch(error){h.innerHTML='<div class="ap-error"><div><h2>تعذر تحميل لوحة الإدارة</h2><p class="ap-note">'+esc(error.message)+'</p><button id="apRetry" class="ap-btn primary">إعادة المحاولة</button></div></div>';document.getElementById('apRetry').onclick=load;return true}
  }
  function renderShell(h){
    var d=state.data,orders=d.orders||[],accounts=d.accounts||[],active=orders.filter(function(o){return ['delivered','active'].includes(o.status)}).length,warranty=orders.filter(function(o){return o.has_warranty&&days(o.warranty_expires_at)>0}).length,today=new Date().toISOString().slice(0,10),alerts=(d.mailSecurityEvents||[]).filter(function(x){return String(x.received_at||'').slice(0,10)===today}).length+(orders.filter(function(o){return Number(o.security_strikes)>0}).length),available=(d.capacity||[]).reduce(function(n,x){return n+Number(x.available_slots||0)},0);
    var expiring=orders.filter(function(o){var n=o.expires_at?Math.ceil((new Date(o.expires_at)-Date.now())/86400000):999;return n<=5&&n>=-30}).length,pendingReviews=(d.reviews||[]).filter(function(r){return r.status==='pending'}).length,pendingCompensations=(d.compensations||[]).filter(function(r){return r.review_mode==='manual_review'&&r.status==='submitted'}).length;
    h.innerHTML='<section class="ap-shell"><nav class="ap-tabs" aria-label="أقسام لوحة الإدارة"><div class="ap-side-brand"><div class="ap-brand-mark">AP</div><div><strong>بوابة أدفانسد برو</strong><small>مركز الإدارة والتشغيل</small></div></div><div class="ap-nav-group"><span class="ap-nav-label">العمليات اليومية</span><button class="ap-tab on" data-tab="overview" data-title="نظرة عامة"><i>⌂</i>نظرة عامة</button><button class="ap-tab" data-tab="orders" data-title="الطلبات والعملاء"><i>▣</i>الطلبات والعملاء <span class="ap-count">'+orders.length+'</span></button><button class="ap-tab" data-tab="renewals" data-title="قرب الانتهاء والتجديدات"><i>↻</i>قرب الانتهاء والتجديدات <span class="ap-count hot">'+expiring+'</span></button><button class="ap-tab" data-tab="compensations" data-title="طلبات التعويض"><i>↺</i>طلبات التعويض <span class="ap-count danger">'+pendingCompensations+'</span></button></div><div class="ap-nav-group"><span class="ap-nav-label">المتجر والجمهور</span><button class="ap-tab" data-tab="reviews" data-title="التقييمات والاقتراحات"><i>★</i>التقييمات والاقتراحات <span class="ap-count hot">'+pendingReviews+'</span></button><button class="ap-tab" data-tab="accounts" data-title="الحسابات والمخزون"><i>◫</i>الحسابات والمخزون <span class="ap-count">'+accounts.length+'</span></button><button class="ap-tab" data-tab="products" data-title="المنتجات والضمان"><i>◆</i>المنتجات والضمان</button></div><div class="ap-nav-group"><span class="ap-nav-label">الحماية والنظام</span><button class="ap-tab" data-tab="security" data-title="الأمان والنزاعات"><i>◉</i>الأمان والنزاعات <span class="ap-count danger">'+alerts+'</span></button><button class="ap-tab" data-tab="settings" data-title="الإعدادات والروابط"><i>⚙</i>الإعدادات والصيانة</button></div><div class="ap-side-footer"><small>Advanced Pro Portal • v2.1</small><button class="ap-logout" id="apLogout">⇥ تسجيل الخروج</button></div></nav><div class="ap-workspace"><header class="ap-head"><button id="apMenuToggle" class="ap-menu-toggle" aria-label="فتح القائمة">☰</button><div><span class="ap-head-kicker">مساحة العمل</span><h1 id="apSectionTitle">نظرة عامة</h1></div><div class="ap-actions"><a class="ap-client-link" href="/" target="_blank" rel="noopener">فتح بوابة العملاء ↗</a><span class="ap-health"><i></i> النظام متصل</span><button class="ap-btn" id="apRefresh">↻ تحديث البيانات</button></div></header><div class="ap-content"><div class="ap-kpis"><article class="ap-kpi"><span class="ap-kpi-icon">▣</span><p>الطلبات النشطة</p><strong>'+active+'</strong><small>من أصل '+orders.length+' طلب</small></article><article class="ap-kpi"><span class="ap-kpi-icon navy">◇</span><p>ضمان سارٍ</p><strong>'+warranty+'</strong><small>طلب داخل مدة الضمان</small></article><article class="ap-kpi '+(alerts?'warn':'')+'"><span class="ap-kpi-icon">!</span><p>تنبيهات الأمان</p><strong>'+alerts+'</strong><small>مخالفات وتنبيهات بريد</small></article><article class="ap-kpi"><span class="ap-kpi-icon navy">◫</span><p>المقاعد المتاحة</p><strong>'+available+'</strong><small>عبر '+accounts.length+' حساب</small></article></div><main id="apPanel" class="ap-panel"></main></div></div></section><div id="apSideBackdrop" class="ap-side-backdrop"></div><div id="apModal" class="ap-modal-back"><div class="ap-modal"><div class="ap-modal-head"><h3 id="apModalTitle"></h3><button class="ap-x" id="apModalClose">×</button></div><div id="apModalBody"></div></div></div><div id="apToast" class="ap-toast"></div>';
    h.querySelector('.ap-nav-label').textContent='العمليات والمتابعة';
    h.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;h.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('on',x===b)});document.getElementById('apSectionTitle').textContent=b.dataset.title;closeSide();renderPanel()}});
    document.getElementById('apMenuToggle').onclick=function(){h.querySelector('.ap-tabs').classList.add('open');document.getElementById('apSideBackdrop').classList.add('open')};document.getElementById('apSideBackdrop').onclick=closeSide;
    document.getElementById('apRefresh').onclick=load;document.getElementById('apLogout').onclick=async function(){await fetch('/api/admin/logout',{method:'POST'});location.href='/admin'};document.getElementById('apModalClose').onclick=closeModal;document.getElementById('apModal').onclick=function(e){if(e.target===e.currentTarget)closeModal()};renderPanel();
  }
  function closeSide(){var n=document.querySelector('.ap-tabs'),b=document.getElementById('apSideBackdrop');if(n)n.classList.remove('open');if(b)b.classList.remove('open')}
  function renderPanel(){if(state.tab==='overview')renderOverview();else if(state.tab==='orders')renderOrders();else if(state.tab==='renewals')renderRenewals();else if(state.tab==='compensations'){renderCompensations();decorateCompensationFilters()}else if(state.tab==='reviews')renderReviews();else if(state.tab==='accounts')renderAccounts();else if(state.tab==='products')renderProducts();else if(state.tab==='security'){renderSecurity();decorateSecurityEvents()}else renderSettings()}
  function decorateCompensationFilters(){var p=document.getElementById('apPanel'),head=p&&p.querySelector('.ap-section-head'),table=p&&p.querySelector('.ap-table');if(!head||!table)return;var filters=document.createElement('div');filters.className='ap-review-filters';filters.innerHTML=[['all','الكل'],['manual','بانتظار المراجعة البشرية'],['auto','تم التعويض آليًا']].map(function(f){return '<button class="ap-review-filter '+(state.compensationFilter===f[0]?'on':'')+'" data-comp-filter="'+f[0]+'">'+f[1]+'</button>'}).join('');head.insertAdjacentElement('afterend',filters);var apply=function(){table.querySelectorAll('tbody tr').forEach(function(row){var text=row.textContent||'',show=state.compensationFilter==='all'||(state.compensationFilter==='manual'&&text.includes('مراجعة بشرية إلزامية'))||(state.compensationFilter==='auto'&&text.includes('تعويض آلي'));row.hidden=!show});filters.querySelectorAll('[data-comp-filter]').forEach(function(b){b.classList.toggle('on',b.dataset.compFilter===state.compensationFilter)})};filters.querySelectorAll('[data-comp-filter]').forEach(function(b){b.onclick=function(){state.compensationFilter=b.dataset.compFilter;apply()}});apply()}
