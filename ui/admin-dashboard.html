<style>

.ap-head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.ap-brand{display:flex;align-items:center;gap:14px}.ap-brand-mark{width:47px;height:47px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ea580c,#9a3412);box-shadow:0 12px 28px #c2410c40;font-weight:900;font-size:1.1rem}.ap-brand h1{font-size:1.55rem;margin:0 0 4px}.ap-brand p{margin:0;color:#94a3b8;font-size:.8rem}.ap-actions{display:flex;gap:9px}

.ap-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.ap-kpi{position:relative;overflow:hidden;background:linear-gradient(145deg,#0f172a,#0a1324);border:1px solid rgba(255,255,255,.08);border-radius:17px;padding:17px;min-height:104px}.ap-kpi:after{content:"";position:absolute;left:-22px;bottom:-30px;width:92px;height:92px;border-radius:50%;background:#ea580c12}.ap-kpi span{color:#94a3b8;font-size:.78rem}.ap-kpi strong{display:block;font-size:1.7rem;margin:8px 0 2px}.ap-kpi small{color:#64748b}.ap-kpi.warn{border-color:#c2410c80}.ap-kpi.warn strong{color:#fb923c}
.ap-tabs{position:sticky;top:8px;z-index:12;display:flex;gap:7px;padding:7px;margin:0 0 14px;overflow:auto;background:#07101fee;border:1px solid rgba(255,255,255,.08);border-radius:15px;backdrop-filter:blur(14px)}.ap-tab{white-space:nowrap;border:0;border-radius:10px;background:transparent;color:#94a3b8;padding:11px 14px;font:inherit;font-size:.79rem;font-weight:900;cursor:pointer}.ap-tab.on{background:linear-gradient(135deg,#ea580c,#c2410c);color:#fff;box-shadow:0 7px 18px #c2410c33}.ap-count{display:inline-grid;place-items:center;min-width:21px;height:21px;margin-right:5px;padding:0 5px;border-radius:20px;background:#ffffff16;font-size:.67rem}
.ap-panel{background:#0b1426;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;min-height:320px}.ap-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.ap-section-head h2{margin:0;font-size:1.05rem}.ap-section-head p{margin:4px 0 0;color:#64748b;font-size:.76rem}.ap-tools{display:flex;gap:9px;flex-wrap:wrap}.ap-input,.ap-select,.ap-textarea{box-sizing:border-box;background:#050a18;border:1px solid #253754;border-radius:10px;color:#f8fafc;padding:10px 11px;font:inherit;font-size:.8rem;outline:0}.ap-input:focus,.ap-select:focus,.ap-textarea:focus{border-color:#ea580c;box-shadow:0 0 0 3px #ea580c18}.ap-tools .ap-input{min-width:240px;flex:1}.ap-scroll{overflow:auto;border:1px solid rgba(255,255,255,.07);border-radius:13px}.ap-table{width:100%;border-collapse:collapse;min-width:900px}.ap-table th,.ap-table td{text-align:right;padding:12px 11px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.75rem;vertical-align:middle}.ap-table th{position:sticky;top:0;background:#0f1b30;color:#94a3b8;font-size:.69rem}.ap-table tr:last-child td{border-bottom:0}.ap-table tbody tr:hover{background:#ffffff04}.ap-order{color:#fb923c;font-weight:900}.ap-sub{display:block;color:#64748b;font-size:.68rem;margin-top:4px}.ap-badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 8px;background:#1e293b;color:#cbd5e1;font-size:.66rem;font-weight:800}.ap-badge.good{background:#052e243d;color:#6ee7b7;border:1px solid #065f4666}.ap-badge.bad{background:#450a0a66;color:#fca5a5;border:1px solid #991b1b88}.ap-badge.orange{background:#7c2d123d;color:#fdba74;border:1px solid #c2410c77}.ap-row-actions{display:flex;gap:6px;flex-wrap:wrap}.ap-empty{text-align:center!important;color:#64748b;padding:34px!important}
.ap-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:16px}.ap-mini{background:#0f172a;border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px}.ap-mini span{color:#94a3b8;font-size:.72rem}.ap-mini strong{display:block;margin-top:7px;font-size:1.2rem}.ap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.ap-card{background:#0f172a;border:1px solid rgba(255,255,255,.07);border-radius:15px;padding:16px}.ap-card h3{margin:0 0 12px;font-size:.94rem}.ap-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.ap-field{display:grid;gap:6px;color:#cbd5e1;font-size:.72rem}.ap-field.wide{grid-column:1/-1}.ap-textarea{min-height:104px;resize:vertical}.ap-check{display:flex;align-items:center;gap:8px;color:#cbd5e1;font-size:.76rem}.ap-note{color:#94a3b8;font-size:.72rem;line-height:1.7}.ap-result{min-height:20px;margin:9px 0 0;color:#fdba74;font-size:.74rem}
.ap-loading,.ap-error{display:grid;place-items:center;text-align:center;min-height:410px}.ap-spinner{width:44px;height:44px;border:4px solid #1e293b;border-top-color:#ea580c;border-radius:50%;animation:apspin .8s linear infinite;margin:auto auto 15px}@keyframes apspin{to{transform:rotate(360deg)}}
.ap-modal-back{position:fixed;inset:0;z-index:60;background:#020617d9;display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(8px)}.ap-modal-back.open{display:flex}.ap-modal{width:min(650px,100%);max-height:86vh;overflow:auto;background:#0b1426;border:1px solid #334155;border-radius:18px;padding:19px;box-shadow:0 28px 90px #000a}.ap-modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.ap-modal-head h3{margin:0}.ap-x{border:0;background:#1e293b;color:#fff;border-radius:9px;width:34px;height:34px;font-size:1.1rem;cursor:pointer}.ap-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.ap-detail{background:#050a18;border:1px solid #1e293b;border-radius:10px;padding:10px}.ap-detail small{display:block;color:#64748b;margin-bottom:5px}.ap-toast{position:fixed;left:22px;bottom:22px;z-index:80;background:#0f172a;border:1px solid #334155;border-right:4px solid #ea580c;border-radius:12px;padding:12px 15px;color:#fff;box-shadow:0 15px 45px #0008;transform:translateY(120px);opacity:0;transition:.2s}.ap-toast.show{transform:none;opacity:1}.ap-toast.error{border-right-color:#dc2626}
@media(max-width:1000px){.ap-kpis{grid-template-columns:1fr 1fr}.ap-grid{grid-template-columns:1fr}.ap-cards{grid-template-columns:1fr 1fr}}
@media(max-width:650px){#dashboard.admin-pro-dashboard{width:min(100% - 18px,1440px);margin-top:12px}.ap-head{align-items:flex-start;flex-direction:column}.ap-actions{width:100%}.ap-actions .ap-btn{flex:1}.ap-kpis{grid-template-columns:1fr 1fr;gap:8px}.ap-kpi{padding:13px;min-height:90px}.ap-kpi strong{font-size:1.35rem}.ap-panel{padding:12px}.ap-section-head{align-items:flex-start;flex-direction:column}.ap-tools{width:100%}.ap-tools .ap-input{min-width:100%}.ap-form,.ap-detail-grid{grid-template-columns:1fr}.ap-field.wide{grid-column:auto}.ap-cards{grid-template-columns:1fr}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  if(!location.pathname.startsWith('/admin')) return;
  var state={data:null,tab:'orders',query:'',orderStatus:''};
  var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var fmt=function(v){if(!v)return '—';try{return new Intl.DateTimeFormat('ar-SA',{dateStyle:'medium',timeZone:'Asia/Riyadh'}).format(new Date(v))}catch(e){return '—'}};
  var days=function(v){return v?Math.max(0,Math.ceil((new Date(v)-Date.now())/86400000)):0};
  var account=function(o){var a=o.account_assignments&&o.account_assignments[0];return a&&a.email_accounts||null};
  var customer=function(o){var c=Array.isArray(o.customers)?o.customers[0]:o.customers;return c&&c.name||'عميل سلة'};
  var toast=function(message,error){var t=document.getElementById('apToast');if(!t)return;t.textContent=message;t.className='ap-toast show'+(error?' error':'');clearTimeout(toast.timer);toast.timer=setTimeout(function(){t.className='ap-toast'},3000)};
  var api=async function(url,options){var r=await fetch(url,options),d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.message||'تعذر إكمال العملية.');return d};
  var host=function(){var h=document.getElementById('dashboard');return h&&h.classList.contains('show')?h:null};
  async function load(){
    var h=host();if(!h)return false;
    document.body.classList.add('admin-pro-mode');h.className='dash show admin-pro-dashboard';
    h.innerHTML='<div class="ap-loading"><div><div class="ap-spinner"></div><strong>جارِ تحميل بيانات التشغيل…</strong><p class="ap-note">يتم الاتصال بقاعدة البيانات الآمنة</p></div></div>';
    try{state.data=await api('/api/admin/operations');renderShell(h);return true}catch(error){h.innerHTML='<div class="ap-error"><div><h2>تعذر تحميل لوحة الإدارة</h2><p class="ap-note">'+esc(error.message)+'</p><button id="apRetry" class="ap-btn primary">إعادة المحاولة</button></div></div>';document.getElementById('apRetry').onclick=load;return true}
  }
  function renderShell(h){
    var d=state.data,orders=d.orders||[],accounts=d.accounts||[],active=orders.filter(function(o){return ['delivered','active'].includes(o.status)}).length,warranty=orders.filter(function(o){return o.has_warranty&&days(o.warranty_expires_at)>0}).length,today=new Date().toISOString().slice(0,10),alerts=(d.mailSecurityEvents||[]).filter(function(x){return String(x.received_at||'').slice(0,10)===today}).length+(orders.filter(function(o){return Number(o.security_strikes)>0}).length),available=(d.capacity||[]).reduce(function(n,x){return n+Number(x.available_slots||0)},0);
    h.innerHTML='<section class="ap-shell"><header class="ap-head"><div class="ap-brand"><div class="ap-brand-mark">AP</div><div><h1>لوحة إدارة أدفانسد برو</h1><p>مركز التشغيل والأمان والضمانات</p></div></div><div class="ap-actions"><button class="ap-btn" id="apRefresh">↻ تحديث</button><button class="ap-btn danger" id="apLogout">تسجيل الخروج</button></div></header><div class="ap-kpis"><article class="ap-kpi"><span>الطلبات النشطة</span><strong>'+active+'</strong><small>من أصل '+orders.length+' طلب</small></article><article class="ap-kpi"><span>ضمان سارٍ</span><strong>'+warranty+'</strong><small>طلب داخل مدة الضمان</small></article><article class="ap-kpi '+(alerts?'warn':'')+'"><span>تنبيهات الأمان اليوم</span><strong>'+alerts+'</strong><small>مخالفات وتنبيهات بريد</small></article><article class="ap-kpi"><span>المقاعد المتاحة</span><strong>'+available+'</strong><small>عبر '+accounts.length+' حساب</small></article></div><nav class="ap-tabs"><button class="ap-tab on" data-tab="orders">▣ الطلبات <span class="ap-count">'+orders.length+'</span></button><button class="ap-tab" data-tab="accounts">◫ الحسابات والمخزون <span class="ap-count">'+accounts.length+'</span></button><button class="ap-tab" data-tab="products">◆ المنتجات والضمان <span class="ap-count">'+(d.mappings||[]).length+'</span></button><button class="ap-tab" data-tab="security">◉ الأمان والنزاعات <span class="ap-count">'+(d.mailSecurityEvents||[]).length+'</span></button><button class="ap-tab" data-tab="settings">⚙ الإعدادات والروابط</button></nav><main id="apPanel" class="ap-panel"></main></section><div id="apModal" class="ap-modal-back"><div class="ap-modal"><div class="ap-modal-head"><h3 id="apModalTitle"></h3><button class="ap-x" id="apModalClose">×</button></div><div id="apModalBody"></div></div></div><div id="apToast" class="ap-toast"></div>';
    h.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;h.querySelectorAll('[data-tab]').forEach(function(x){x.classList.toggle('on',x===b)});renderPanel()}});
    document.getElementById('apRefresh').onclick=load;document.getElementById('apLogout').onclick=async function(){await fetch('/api/admin/logout',{method:'POST'});location.href='/admin'};document.getElementById('apModalClose').onclick=closeModal;document.getElementById('apModal').onclick=function(e){if(e.target===e.currentTarget)closeModal()};renderPanel();
  }
  function renderPanel(){if(state.tab==='orders')renderOrders();else if(state.tab==='accounts')renderAccounts();else if(state.tab==='products')renderProducts();else if(state.tab==='security')renderSecurity();else renderSettings()}
  function renderOrders(){
    var p=document.getElementById('apPanel'),rows=(state.data.orders||[]).filter(function(o){return (!state.orderStatus||o.status===state.orderStatus)&&JSON.stringify(o).toLowerCase().includes(state.query.toLowerCase())});
    p.innerHTML='<div class="ap-section-head"><div><h2>الطلبات والعملاء</h2><p>حالة الخدمة والضمان والإقرار ونزاهة الجهاز في مكان واحد.</p></div><div class="ap-tools"><input id="apSearch" class="ap-input" placeholder="ابحث برقم الطلب أو العميل أو الجوال"><select id="apOrderStatus" class="ap-select"><option value="">كل الحالات</option><option value="delivered">نشط / مسلم</option><option value="pending_assignment">بانتظار التسكين</option><option value="suspended_security">موقوف أمنيًا</option><option value="expired">منتهي</option></select></div></div><div class="ap-scroll"><table class="ap-table"><thead><tr><th>الطلب والعميل</th><th>المنتج</th><th>الحساب</th><th>الضمان</th><th>الإقرار</th><th>النزاهة</th><th>الإجراءات</th></tr></thead><tbody>'+((rows.map(orderRow).join(''))||'<tr><td colspan="7" class="ap-empty">لا توجد طلبات مطابقة.</td></tr>')+'</tbody></table></div>';
    var s=document.getElementById('apSearch'),f=document.getElementById('apOrderStatus');s.value=state.query;f.value=state.orderStatus;s.oninput=function(){state.query=s.value;renderOrders()};f.onchange=function(){state.orderStatus=f.value;renderOrders()};bindOrderActions(p);
  }
  function orderRow(o){var a=account(o),strikes=Number(o.security_strikes||0),warranty=o.has_warranty?(days(o.warranty_expires_at)+' يوم متبقٍ'):'بدون ضمان';return '<tr><td><span class="ap-order">#'+esc(o.order_number)+'</span><span class="ap-sub">'+esc(customer(o))+' · '+esc(o.customer_phone||'بلا جوال')+'</span></td><td>'+esc(o.product_name||o.service_type||'—')+'<span class="ap-sub">'+esc(o.status)+'</span></td><td>'+esc(a&&a.mailbox_alias||'غير مسكّن')+'</td><td><span class="ap-badge '+(o.has_warranty?'good':'orange')+'">'+esc(warranty)+'</span></td><td><span class="ap-badge '+(o.acknowledged_at?'good':'orange')+'">'+(o.acknowledged_at?'موثّق':'بانتظار العميل')+'</span></td><td><span class="ap-badge '+(strikes?'bad':'good')+'">'+strikes+' مخالفات</span></td><td><div class="ap-row-actions"><button class="ap-btn small" data-details="'+o.id+'">التفاصيل</button><button class="ap-btn small" data-reset="'+o.id+'">تصفير الجهاز</button><button class="ap-btn small primary" data-report="'+o.id+'">تقرير سلة</button></div></td></tr>'}
  function bindOrderActions(root){root.querySelectorAll('[data-details]').forEach(function(b){b.onclick=function(){showDetails(b.dataset.details)}});root.querySelectorAll('[data-reset]').forEach(function(b){b.onclick=function(){showReset(b.dataset.reset)}});root.querySelectorAll('[data-report]').forEach(function(b){b.onclick=function(){copyReport(b.dataset.report,b)}})}
  function showDetails(id){var o=(state.data.orders||[]).find(function(x){return x.id===id});if(!o)return;var a=account(o);openModal('تفاصيل الطلب #'+esc(o.order_number),'<div class="ap-detail-grid"><div class="ap-detail"><small>العميل</small>'+esc(customer(o))+'</div><div class="ap-detail"><small>الجوال</small>'+esc(o.customer_phone||'—')+'</div><div class="ap-detail"><small>المنتج</small>'+esc(o.product_name||o.service_type)+'</div><div class="ap-detail"><small>الحساب</small>'+esc(a&&a.mailbox_alias||'غير مسكّن')+'</div><div class="ap-detail"><small>بداية الاشتراك</small>'+fmt(o.starts_at)+'</div><div class="ap-detail"><small>نهاية الاشتراك</small>'+fmt(o.expires_at)+'</div><div class="ap-detail"><small>الجهاز المسجل</small>'+esc(o.locked_device_name||'لم يسجل بعد')+'</div><div class="ap-detail"><small>فرصة النقل المجاني</small>'+Number(o.free_resets_remaining||0)+'</div></div><div class="ap-card" style="margin-top:12px"><h3>إقرار المنتج</h3><p class="ap-note" style="white-space:pre-line">'+esc(o.acknowledgment_text||'لا يوجد نص إقرار محفوظ.')+'</p></div>')}
  function showReset(id){var o=(state.data.orders||[]).find(function(x){return x.id===id});openModal('تصفير الجهاز للطلب #'+esc(o&&o.order_number),'<p class="ap-note">سيتم فك القفل الأمني ومسح بصمة الجهاز والمخالفات الموثقة لهذا الطلب.</p><label class="ap-check"><input id="apRestoreReset" type="checkbox" checked> إعادة منح فرصة نقل مجاني واحدة</label><div class="ap-row-actions" style="margin-top:18px"><button id="apConfirmReset" class="ap-btn primary">تأكيد التصفير</button><button id="apCancelReset" class="ap-btn">إلغاء</button></div>');document.getElementById('apCancelReset').onclick=closeModal;document.getElementById('apConfirmReset').onclick=async function(){var b=this;b.disabled=true;try{await api('/api/admin/orders/'+id+'/reset-device',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({restoreFreeReset:document.getElementById('apRestoreReset').checked})});closeModal();toast('تم تصفير الجهاز وفك القفل الأمني.');await reloadData()}catch(e){toast(e.message,true);b.disabled=false}}}
  async function copyReport(id,b){var old=b.textContent;b.disabled=true;b.textContent='جارِ التوليد…';try{var d=await api('/api/admin/dispute-report?orderId='+encodeURIComponent(id));await navigator.clipboard.writeText(d.report);toast('تم نسخ تقرير إثبات شكوى سلة.');b.textContent='تم النسخ'}catch(e){toast(e.message,true);b.textContent=old}finally{b.disabled=false;setTimeout(function(){b.textContent=old},1600)}}
  function renderAccounts(){var p=document.getElementById('apPanel'),d=state.data,capacity=d.capacity||[],accounts=d.accounts||[];p.innerHTML='<div class="ap-section-head"><div><h2>الحسابات والمخزون</h2><p>السعة المتاحة والاستيراد الجماعي وسلامة الحسابات.</p></div><button id="apArchive" class="ap-btn">أرشفة المنتهي</button></div><div class="ap-cards">'+capacity.map(function(c){return '<div class="ap-mini"><span>'+esc(c.service_type)+'</span><strong>'+Number(c.available_slots||0)+' متاح</strong><span class="ap-sub">'+Number(c.occupied_slots||0)+' مستخدم من '+Number(c.total_slots||0)+'</span></div>'}).join('')+'</div><div class="ap-grid"><div class="ap-card"><h3>استيراد جماعي آمن</h3><div class="ap-form"><label class="ap-field wide">البريد — سطر لكل حساب<textarea id="apBulkEntries" class="ap-textarea" placeholder="account1@example.com\naccount2@example.com"></textarea></label><label class="ap-field">الخدمة<select id="apBulkService" class="ap-select"><option value="crunchyroll">Crunchyroll</option><option value="chatgpt">ChatGPT</option></select></label><label class="ap-field">سعة المقاعد<input id="apBulkSlots" class="ap-input" type="number" min="1" value="1"></label><button id="apBulkSend" class="ap-btn primary">استيراد الحسابات</button></div><p id="apBulkResult" class="ap-result"></p></div><div class="ap-card"><h3>ملخص السلامة</h3><p class="ap-note">الحساب السليم يظهر باللون الأخضر. التنبيهات تعني أن الحساب يحتاج مراجعة قبل التسكين.</p><div class="ap-cards"><div class="ap-mini"><span>نشط</span><strong>'+accounts.filter(function(a){return a.is_active&&!a.archived_at}).length+'</strong></div><div class="ap-mini"><span>تنبيه نزاهة</span><strong>'+accounts.filter(function(a){return a.integrity_status&&a.integrity_status!=='clean'}).length+'</strong></div></div></div></div><div class="ap-scroll" style="margin-top:15px"><table class="ap-table"><thead><tr><th>البريد</th><th>الخدمة</th><th>السعة</th><th>نزاهة الحساب</th><th>آخر تدوير</th><th>الحالة</th></tr></thead><tbody>'+     document.getElementById('apBulkSend').onclick=bulkImport;document.getElementById('apArchive').onclick=archiveExpired;
  }
  async function bulkImport(){var r=document.getElementById('apBulkResult'),entries=document.getElementById('apBulkEntries').value;r.textContent='جارِ الاستيراد…';try{var d=await api('/api/admin/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'bulk_import',bulk:{storeId:state.data.storeId,entries:entries,serviceType:document.getElementById('apBulkService').value,maxSlots:document.getElementById('apBulkSlots').value}})});r.textContent='تمت إضافة '+d.report.inserted_count+' وتجاهل '+d.report.duplicate_count+' مكررًا.';await reloadData()}catch(e){r.textContent=e.message}}

  function renderProducts(){var p=document.getElementById('apPanel'),m=state.data.mappings||[];p.innerHTML='<div class="ap-section-head"><div><h2>تصنيفات المنتجات والضمان</h2><p>اربط معرّف منتج سلة بسياسة تسليم وضمان وإقرار ثابتة.</p></div></div><div class="ap-grid"><form id="apMappingForm" class="ap-card ap-form"><h3 class="ap-field wide">إضافة أو تحديث تصنيف</h3><label class="ap-field">Product ID / SKU<input name="productId" class="ap-input" required></label><label class="ap-field">اسم المنتج<input name="title" class="ap-input"></label><label class="ap-field">الخدمة<select name="service" class="ap-select"><option value="crunchyroll">Crunchyroll</option><option value="chatgpt">ChatGPT</option></select></label><label class="ap-field">مدة الاشتراك بالأيام<input name="duration" class="ap-input" type="number" min="1" value="30"></label><label class="ap-check wide"><input name="warranty" type="checkbox" checked> المنتج مشمول بالضمان</label><label class="ap-field">مدة الضمان بالأيام<input name="warrantyDays" class="ap-input" type="number" min="0" value="30"></label><label class="ap-field">رابط التجديد<input name="renewalUrl" class="ap-input" type="url" placeholder="https://..."></label><label class="ap-field wide">نص إقرار المنتج<textarea name="ack" class="ap-textarea" placeholder="اتركه فارغًا لاستخدام القالب الجاهز"></textarea></label><button class="ap-btn primary">حفظ التصنيف</button><p id="apMappingResult" class="ap-result"></p></form><div class="ap-card"><h3>قوالب جاهزة</h3><p class="ap-note">عند ترك نص الإقرار فارغًا، يستخدم النظام تلقائيًا قالبًا مناسبًا حسب وجود الضمان. تحفظ نسخة الشروط داخل الطلب ولا تتغير عند تعديل التصنيف لاحقًا.</p><button id="apWarrantyTemplate" class="ap-btn small">قالب بضمان</button> <button id="apNoWarrantyTemplate" class="ap-btn small">قالب بلا ضمان</button></div></div><div class="ap-scroll" style="margin-top:15px"><table class="ap-table"><thead><tr><th>معرّف سلة</th><th>العنوان</th><th>الخدمة</th><th>المدة</th><th>الضمان</th><th>الإقرار     var form=document.getElementById('apMappingForm'),withWarranty='يشمل الضمان التوقف المفاجئ طوال المدة المحددة.\nيُلغى الضمان عند تغيير البريد أو كلمة المرور أو مشاركة الحساب.\nيتم التعويض بعد التحقق من الالتزام بشروط الاستخدام.',withoutWarranty='يُسلّم المنتج بحالة سليمة وقت الشراء.\nهذا المنتج تسليم لمرة واحدة ولا يشمله التعويض بعد التسليم.\nيتحمل العميل مسؤولية حفظ بيانات المنتج بعد استلامه.';document.getElementById('apWarrantyTemplate').onclick=function(){form.ack.value=withWarranty};document.getElementById('apNoWarrantyTemplate').onclick=function(){form.ack.value=withoutWarranty};form.onsubmit=saveMapping;
  }
  async function saveMapping(e){e.preventDefault();var f=e.currentTarget,r=document.getElementById('apMappingResult');r.textContent='جارِ الحفظ…';try{await api('/api/admin/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'save_mapping',mapping:{salla_product_id:f.productId.value,product_title:f.title.value,service_type:f.service.value,duration_days:f.duration.value,has_warranty:f.warranty.checked,warranty_days:f.warrantyDays.value,acknowledgment_text:f.ack.value,renewal_url:f.renewalUrl.value}})});toast('تم حفظ تصنيف المنتج.');await reloadData()}catch(x){r.textContent=x.message}}
  function renderSecurity(){var p=document.getElementById('apPanel'),events=state.data.mailSecurityEvents||[],flagged=(state.data.orders||[]).filter(function(o){return Number(o.security_strikes)>0});p.innerHTML='<div class="ap-section-head"><div><h2>الأمان والنزاعات</h2><p>مخالفات الأجهزة وتنبيهات تغيير كلمة المرور وتقارير الإثبات.</p></div></div><div class="ap-grid"><div class="ap-card"><h3>طلبات عليها مخالفات</h3><div class="ap-scroll"><table class="ap-table"><thead><tr><th>الطلب</th><th>المخالفات</th><th>الجهاز</th><th>الإجراء</th></tr></thead><tbody>'+((flagged.map(function(o){return '<tr><td>#'+esc(o.order_number)+'</td><td><span class="ap-badge bad">'+Number(o.security_strikes)+' مخالفات</span></td><td>'+esc(o.locked_device_name||'—')+'</td><td><div class="ap-row-actions"><button class="ap-btn small" data-reset="'+o.id+'">تصفير</button><button class="ap-btn small primary" data-report="'+o.id+'">نسخ التقرير</button></div></td></tr>'}).join(''))||'<tr><td colspan="4" class="ap-empty">لا توجد مخالفات أجهزة.</td></tr>')+'</tbody></table></div></div><div class="ap-card"><h3>تنبيهات البريد والحساب</h3><div class="ap-scroll"><table class="ap-table"><thead><tr><th>النوع</th><th>الحساب</th><th>الطلب المشتبه</th><th>الوقت</th></tr></thead><tbody>'+((events.map(function(x){return '<tr><td><span class="ap-badge orange">'+esc(x.event_type)+'</span></td><td>'+esc(x.email_accounts&&x.email_accounts.mailbox_alias||'—')+'</td><td>'+esc(x.suspected_order_id||'غير محدد')+'</td><td>'+fmt(x.received_at)+'</td></tr>'}).join(''))||'<tr><td colspan="4" class="ap-empty">لا توجد تنبيهات بريد.</td></tr>')+'</tbody></table></div></div></div>';bindOrderActions(p)}
  function renderSettings(){var p=document.getElementById('apPanel'),s=state.data.settings||{};p.innerHTML='<div class="ap-section-head"><div><h2>الإعدادات والروابط</h2><p>الروابط العامة وحالة التشغيل التي تظهر للعملاء.</p></div></div><form id="apSettingsForm" class="ap-grid"><div class="ap-card ap-form"><h3 class="ap-field wide">روابط خدمة العملاء</h3><label class="ap-field">رقم واتساب الدعم<input name="whatsapp" class="ap-input" value="'+esc(s.support_whatsapp||'')+'" placeholder="9665XXXXXXXX"></label><label class="ap-field">رابط تقييم سلة<input name="review" class="ap-input" type="url" value="'+esc(s.salla_review_url||'')+'" placeholder="https://..."></label><label class="ap-field">رابط المتجر للتجديد<input name="renewal" class="ap-input" type="url" value="'+esc(s.renewal_store_url||'')+'" placeholder="https://..."></label><label class="ap-field">رابط بوابة كرانشي رول<input name="crunchyroll" class="ap-input" type="url" value="'+esc(s.crunchyroll_portal_url||'')+'" placeholder="https://..."></label></div><div class="ap-card ap-form"><h3 class="ap-field wide">حالة النظام</h3><label class="ap-check wide"><input name="bannerActive" type="checkbox" '+(s.banner_active?'checked':'')+'> تفعيل إعلان الصيانة للعملاء</label><label class="ap-field wide">نص الإعلان<textarea name="banner" class="ap-textarea">'+esc(s.banner_message||'')+'</textarea></label><label class="ap-check wide"><input name="paused" type="checkbox" '+(s.auto_assignment_paused?'checked':'')+'> إيقاف التسكين الآلي مؤقتًا</label><button class="ap-btn primary">حفظ جميع الإعدادات</button><p id="apSettingsResult" class="ap-result"></p></div></form>';document.getElementById('apSettingsForm').onsubmit=saveSettings}
  async function saveSettings(e){e.preventDefault();var f=e.currentTarget,r=document.getElementById('apSettingsResult');r.textContent='جارِ الحفظ…';try{await api('/api/admin/operations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'save_settings',settings:{banner_active:f.bannerActive.checked,banner_message:f.banner.value,auto_assignment_paused:f.paused.checked,support_whatsapp:f.whatsapp.value,salla_review_url:f.review.value,renewal_store_url:f.renewal.value,crunchyroll_portal_url:f.crunchyroll.value}})});r.textContent='تم حفظ الإعدادات بنجاح.';toast('تم تحديث إعدادات البوابة.');await reloadData()}catch(x){r.textContent=x.message}}
  function openModal(title,html){document.getElementById('apModalTitle').innerHTML=title;document.getElementById('apModalBody').innerHTML=html;document.getElementById('apModal').classList.add('open')}

  var observer=new MutationObserver(function(){if(host()){observer.disconnect();load()}});observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});if(host()){observer.disconnect();load()}
