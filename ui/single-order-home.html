<style>

  html.current-home body { background: #071a35 !important; }
  html.current-home .top, html.current-home .shell > .footer { display: none !important; }
  html.current-home .shell { max-width: none; padding: 0; }
  .split-home-ready .top, .split-home-ready > .footer, .split-home-ready .shell > .footer { display: none !important; }

  .split-copy { position: relative; z-index: 1; max-width: 760px; }

    margin: 20px 0 10px;

  .split-bottom { min-height: 55vh; padding: 0 20px 36px; background: #071a35; }
  .floating-wrap { position: relative; z-index: 2; width: min(590px, 100%); margin: 0 auto; transform: translateY(-36px); }
  .single-card {

  .single-label {
    display: block;

  }
  .single-label b { margin-left: 6px; color: #fb923c; font-size: 1.16rem; }
  .lookup-pair { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: end; }
  .lookup-pair .single-label { display: grid; gap: 8px; }
  .lookup-pair [hidden] { display: none !important; }
  .order-input-wrap {
    position: relative;
    display: block;
    overflow: hidden;
    border: 1px solid #263954;
    border-radius: 14px;
    background: #06152d;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .order-input-wrap:focus-within {
    border-color: #ea580c;
    background: #081a34;
    box-shadow: 0 0 0 3px rgba(234, 88, 12, .25), 0 10px 26px rgba(194, 65, 12, .12);
  }
  .order-input-wrap:has(.single-input[aria-invalid="true"]) { border-color: #fb7185; box-shadow: 0 0 0 3px rgba(251, 113, 133, .2); }
  .single-input {
    width: 100%;
    height: 58px;
    padding: 0 84px 0 92px;
    color: #fff;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    border: 0;
    border-radius: inherit;
    outline: none;
    background: transparent;
  }
  .single-input::placeholder { color: #64748b; }
  .single-input[aria-invalid="true"] { color: #fecdd3; }
  .input-tool { position: absolute; top: 50%; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid #ffffff1f; color: #cbd5e1; background: #0f2747cc; backdrop-filter: blur(10px); transform: translateY(-50%); transition: border-color .2s, color .2s, box-shadow .2s, background .2s; }
  .paste-tool { left: 7px; min-width: 76px; height: 42px; padding: 0 10px; border-radius: 10px; font-size: .78rem; font-weight: 900; }
  .paste-tool svg { width: 17px; height: 17px; }
  .paste-tool:hover { border-color: #ea580c; color: #fed7aa; background: #7c2d124f; box-shadow: 0 0 18px #ea580c36; }
  .paste-tool.success { border-color: #22c55e88; color: #86efac; background: #052e2bcc; }
  .clear-tool { right: 8px; width: 34px; height: 34px; padding: 0; border-radius: 50%; color: #94a3b8; font-size: 1.25rem; line-height: 1; }
  .clear-tool:hover { border-color: #fb718577; color: #fecdd3; background: #4c051944; }
  .single-action {
    width: 100%;
    margin-top: 14px;
    min-height: 56px;
    padding: 14px 18px;
    border: 0;
    border-radius: 13px;
    color: #fff;
    font-size: .98rem;
    font-weight: 900;
    background: linear-gradient(135deg, #9a3412 0%, #c2410c 52%, #ea580c 100%);
    box-shadow: 0 14px 32px rgba(194, 65, 12, .34), inset 0 1px rgba(255, 255, 255, .12);
    transition: filter .2s, transform .2s, box-shadow .2s;
  }
  .single-action:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 17px 38px rgba(194, 65, 12, .42), inset 0 1px rgba(255, 255, 255, .14); }
  .single-action:disabled { cursor: wait; opacity: .7; transform: none; }
  .single-message { min-height: 18px; margin: 10px 0 0; color: #fda4af; text-align: center; font-size: .79rem; }
  .security-note {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: flex-start;
    margin: 12px auto 0;
    color: #94a3b8;
    text-align: center;
    line-height: 1.65;
    font-size: .72rem;
  }
  .security-note i { color: #fb923c; font-style: normal; }
  @media (max-width: 650px) {
    .lookup-pair { grid-template-columns: 1fr; }
    .split-top { min-height: clamp(280px, 37vh, 370px); padding: calc(38px + env(safe-area-inset-top, 0px)) 16px 96px; }
    .split-title { font-size: 2.35rem; }
    .split-bottom { min-height: 57vh; padding-inline: 14px; }
    .floating-wrap { transform: translateY(-36px); }
    .single-card { padding: 19px 16px; border-radius: 20px; }
    .single-input { padding-inline: 48px 88px; font-size: 1.05rem; }

</style>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (location.pathname !== '/') return;
    if (await window.apMaintenanceGate?.()) return;
    if (!document.getElementById('portal')) return;
    document.body.classList.add('split-home-ready');
    const form = document.getElementById('singleOrderLookup');
    if (!form) return;
    const orderInput = document.getElementById('singleOrderNumber');
    const incomingRef=new URLSearchParams(location.search).get('ref');if(/^[A-Z0-9]{8,32}$/i.test(incomingRef||''))localStorage.setItem('advpro_referral',incomingRef.toUpperCase());
    const message = document.getElementById('singleLookupMessage');
    const { normalizeOrderNumber } = await import('/lib/order-number.js');
    const { setOrderProgress, openOrderDetails } = await import('/lib/order-progress.js');
    const pasteButton = document.getElementById('pasteOrderNumber');
    const clearButton = document.getElementById('clearOrderNumber');
    const updateTools = () => { clearButton.hidden = !orderInput.value; };
    orderInput.addEventListener('input', () => {
      if (button.disabled) return;
      const orderNumber = normalizeOrderNumber(orderInput.value);
      if (orderNumber && orderInput.value !== orderNumber) orderInput.value = orderNumber;
      orderInput.removeAttribute('aria-invalid');
      message.textContent = '';
      updateTools();
    });
    clearButton.addEventListener('click', () => { orderInput.value = ''; updateTools(); orderInput.focus(); message.textContent = ''; });
    pasteButton.addEventListener('click', async () => {
      try {
        if (!navigator.clipboard?.readText || !window.isSecureContext) throw new Error('clipboard-unavailable');
        const orderNumber = normalizeOrderNumber(await navigator.clipboard.readText());
        orderInput.value = orderNumber;
        updateTools();
        orderInput.removeAttribute('aria-invalid');
        message.textContent = orderNumber ? '' : 'لم نجد رقم طلب في النص المنسوخ.';
        const original = pasteButton.innerHTML;
        pasteButton.classList.add('success'); pasteButton.innerHTML = '<span>تم اللصق ✓</span>';
        setTimeout(() => { pasteButton.classList.remove('success'); pasteButton.innerHTML = original; }, 1500);
      } catch {
        orderInput.focus();
        message.textContent = 'الصق رقم الطلب يدويًا داخل الحقل.';
      }
    });
    const button = form.querySelector('.single-action');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (button.disabled) return;
      const orderNumber = normalizeOrderNumber(orderInput.value);
      orderInput.value = orderNumber;
      if (!orderNumber) {
        orderInput.setAttribute('aria-invalid', 'true');
        message.textContent = 'أدخل رقم الطلب بالأرقام فقط.';
        orderInput.focus();
        return;
      }
      button.disabled = true;
      message.textContent = '';
      setOrderProgress('search');
      let navigating = false;
      try {
        const result = await fetch('/api/public/lookup', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ orderNumber, referralCode:localStorage.getItem('advpro_referral') || null })
        });
        const data = await result.json().catch(() => ({}));
        if (result.ok && data.redirectTo) {
          localStorage.removeItem('advpro_referral');
          navigating = await openOrderDetails({
            token: data.trackingToken, destination: data.redirectTo,
            onOtherOrder: () => { orderInput.value = ''; orderInput.dispatchEvent(new Event('input')); },
          });
          return;
        }
        message.textContent = result.status === 503
          ? 'خدمة الاستعلام غير متاحة مؤقتًا. يرجى المحاولة بعد قليل.'
          : data.message || 'لم يتم العثور على الطلب. تحقق من الرقم وحاول مجددًا.';
      } catch (error) {
        message.textContent = error instanceof TypeError ? 'تعذر الاتصال بالخدمة. حاول بعد قليل.' : error.message;
      } finally {
        if (!navigating) {
          setOrderProgress();
          button.disabled = false;
          orderInput.focus();
        }
      }
    });
    window.addEventListener('pageshow', event => {
      if (!event.persisted) return;
      setOrderProgress();
      button.disabled = false;
    });
    button.disabled = false;
  });
</script>
