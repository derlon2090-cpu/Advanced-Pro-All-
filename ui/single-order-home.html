<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (location.pathname !== '/') return;
    const portal = document.getElementById('portal');
    if (!portal) return;
    document.body.classList.add('split-home-ready');
    portal.innerHTML = '<main class="single-home"><section class="split-top"><div class="split-copy"><span class="brand-pill"><i>♢</i> بوابة أدفانسد برو | Advanced Pro Portal</span><h1 class="split-title">بوابة استعلام عن طلبك</h1><p class="split-lead">أدخل رقم الطلب لعرض وتفعيل اشتراكك فورًا</p></div></section><section class="split-bottom"><div class="floating-wrap"><div class="single-card"><form id="singleOrderLookup"><label class="single-label" for="singleOrderNumber"><b>#</b> رقم الطلب</label><input id="singleOrderNumber" class="single-input" name="orderNumber" required inputmode="numeric" autocomplete="off" placeholder="مثال: 123456789"><button class="single-action" type="submit">⌕ &nbsp; عرض بيانات الاشتراك</button><p id="singleLookupMessage" class="single-message" role="status"></p></form><div class="security-note"><i>▣</i><span>ملاحظة أمنية: تقوم البوابة بجمع بيانات الجهاز والمتصفح تلقائيًا لربط اشتراكك بجهاز واحد وحمايته.</span></div></div><div class="clean-footer"><a class="support-line" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('مرحبًا، لا أجد رقم طلبي في بوابة أدفانسد برو')+'">لا تجد رقم الطلب؟ تواصل مع الدعم</a><div class="copyright">© بوابة أدفانسد برو | Advanced Pro Portal</div></div></div></section></main>';

    document.getElementById('singleOrderLookup').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const message = document.getElementById('singleLookupMessage');
      button.disabled = true;
      button.textContent = 'جارِ التحقق…';
      message.textContent = '';
      try {
        const result = await fetch('/api/public/lookup', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ orderNumber: form.elements.orderNumber.value })
        });
        const data = await result.json().catch(() => ({}));
        if (result.ok && data.redirectTo) return location.assign(data.redirectTo);
        message.textContent = data.message || 'لم يتم العثور على الطلب. تحقق من الرقم وحاول مجددًا.';
      } catch {
        message.textContent = 'تعذر الاتصال بالخدمة. حاول بعد قليل.';
      } finally {
        button.disabled = false;
        button.textContent = '⌕  عرض بيانات الاشتراك';
      }
    });
  });
</script>
