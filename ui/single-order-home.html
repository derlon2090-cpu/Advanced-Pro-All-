<style>
  html.current-home body { visibility: visible !important; }
  body.split-home-ready { background: #071a35 !important; }
  html.current-home body { background: #071a35 !important; }
  html.current-home .top, html.current-home .shell > .footer { display: none !important; }
  html.current-home .shell { max-width: none; padding: 0; }
  .split-home-ready .top, .split-home-ready > .footer, .split-home-ready .shell > .footer { display: none !important; }
  .split-home-ready .shell { max-width: none; padding: 0; }
  .single-home { min-height: 100vh; background: #071a35; color: #f8fafc; overflow: hidden; }
  .split-top {
    position: relative;
    min-height: 45vh;
    padding: clamp(58px, 8vh, 92px) 20px 155px;
    display: flex;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(135deg, #9a3412 0%, #ea580c 55%, #c2410c 100%);
  }
  .split-top::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, .16) 1.5px, transparent 1.5px);
    background-size: 24px 24px;
  }
  .split-copy { position: relative; z-index: 1; max-width: 760px; }
  .split-title {
    margin: 20px 0 10px;
    color: #fff;
    font-size: clamp(2.25rem, 5vw, 4.15rem);
    line-height: 1.16;
    letter-spacing: -.045em;
  }
  .split-lead { margin: 0; color: #fff; opacity: .9; font-size: clamp(.95rem, 2vw, 1.08rem); }
  .split-bottom { min-height: 55vh; padding: 0 20px 36px; background: #071a35; }
  .floating-wrap { position: relative; z-index: 2; width: min(590px, 100%); margin: 0 auto; transform: translateY(-36px); }
  .single-card {
    padding: 28px;
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 24px;
    background: rgba(11, 18, 36, .92);
    box-shadow: 0 32px 80px rgba(0, 0, 0, .52), 0 14px 34px rgba(2, 6, 23, .58), inset 0 1px rgba(255, 255, 255, .04);
  }
  .portal-health { position:absolute; z-index:2; top:24px; right:max(20px,calc((100% - 1120px)/2)); display:inline-flex; align-items:center; gap:9px; padding:9px 14px; border:1px solid #166534; border-radius:999px; color:#86efac; background:#052e20; font-size:.82rem; font-weight:800; }
  .portal-health i { width:9px; height:9px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 5px #22c55e1c,0 0 18px #22c55e; animation:healthPulse 1.8s infinite; }
  @keyframes healthPulse { 50% { box-shadow:0 0 0 8px transparent,0 0 22px #22c55e; } }
  .single-label {
    display: block;
    margin-bottom: 12px;
    color: #f8fafc;
    text-align: center;
    font-size: 1rem;
    font-weight: 900;
  }
  .single-label b { margin-left: 6px; color: #fb923c; font-size: 1.16rem; }
  .lookup-pair { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: end; }
  .lookup-pair .single-label { display: grid; gap: 8px; }
  .lookup-pair [hidden] { display: none !important; }
  .order-input-wrap {
    position: relative;
    display: block;
    overflow: hidden;
    border: 1px solid #263954;
    border-radius: 14px;
    background: #06152d;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  .order-input-wrap:focus-within {
    border-color: #ea580c;
    background: #081a34;
    box-shadow: 0 0 0 3px rgba(234, 88, 12, .25), 0 10px 26px rgba(194, 65, 12, .12);
  }
  .order-input-wrap:has(.single-input[aria-invalid="true"]) { border-color: #fb7185; box-shadow: 0 0 0 3px rgba(251, 113, 133, .2); }
  .single-input {
    width: 100%;
    height: 58px;
    padding: 0 84px 0 92px;
    color: #fff;
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    border: 0;
    border-radius: inherit;
    outline: none;
    background: transparent;
  }
  .single-input::placeholder { color: #64748b; }
  .single-input[aria-invalid="true"] { color: #fecdd3; }
  .input-tool { position: absolute; top: 50%; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid #ffffff1f; color: #cbd5e1; background: #0f2747cc; backdrop-filter: blur(10px); transform: translateY(-50%); transition: border-color .2s, color .2s, box-shadow .2s, background .2s; }
  .paste-tool { left: 7px; min-width: 76px; height: 42px; padding: 0 10px; border-radius: 10px; font-size: .78rem; font-weight: 900; }
  .paste-tool svg { width: 17px; height: 17px; }
  .paste-tool:hover { border-color: #ea580c; color: #fed7aa; background: #7c2d124f; box-shadow: 0 0 18px #ea580c36; }
  .paste-tool.success { border-color: #22c55e88; color: #86efac; background: #052e2bcc; }
  .clear-tool { right: 8px; width: 34px; height: 34px; padding: 0; border-radius: 50%; color: #94a3b8; font-size: 1.25rem; line-height: 1; }
  .clear-tool:hover { border-color: #fb718577; color: #fecdd3; background: #4c051944; }
  .single-action {
    width: 100%;
    margin-top: 14px;
    min-height: 56px;
    padding: 14px 18px;
    border: 0;
    border-radius: 13px;
    color: #fff;
    font-size: .98rem;
    font-weight: 900;
    background: linear-gradient(135deg, #9a3412 0%, #c2410c 52%, #ea580c 100%);
    box-shadow: 0 14px 32px rgba(194, 65, 12, .34), inset 0 1px rgba(255, 255, 255, .12);
    transition: filter .2s, transform .2s, box-shadow .2s;
  }
  .single-action:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 17px 38px rgba(194, 65, 12, .42), inset 0 1px rgba(255, 255, 255, .14); }
  .single-action:disabled { cursor: wait; opacity: .7; transform: none; }
  .single-message { min-height: 18px; margin: 10px 0 0; color: #fda4af; text-align: center; font-size: .79rem; }
  .security-note {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: flex-start;
    margin: 12px auto 0;
    color: #94a3b8;
    text-align: center;
    line-height: 1.65;
    font-size: .72rem;
  }
  .security-note i { color: #fb923c; font-style: normal; }
  .clean-footer { margin-top: 17px; text-align: center; }
  .support-line {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #94a3b8;
    font-size: .82rem;
    font-weight: 700;
    text-decoration: none;
    transition: color .2s, transform .2s;
  }
  .support-line strong { color: #22c55e; font-weight: 900; }
  .support-line svg { width: 17px; height: 17px; color: #22c55e; }
  .support-line:hover { color: #cbd5e1; transform: translateY(-1px); }
  .support-line:hover strong, .support-line:hover svg { color: #4ade80; }
  .footer-mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    margin: 15px auto 0;
  }
  .footer-mark img { width: 34px; height: 34px; object-fit: contain; display: block; }
  .copyright { margin-top: 13px; color: #64748b; font-size: .72rem; }
  .social-proof{margin-top:15px;padding:13px;border:1px solid #1e3a5f;border-radius:14px;background:#081a35;overflow:hidden}.social-proof h2{margin:0 0 9px;color:#fdba74;font-size:.78rem;text-align:center}.proof-track{display:flex;gap:10px;overflow:auto;scrollbar-width:none}.proof-item{min-width:210px;padding:10px;border-radius:10px;background:#06152d}.proof-stars{color:#fb923c;letter-spacing:1px}.proof-item strong,.proof-item small{display:block}.proof-item strong{margin-top:5px;font-size:.72rem}.proof-item small{margin-top:3px;color:#94a3b8;font-size:.64rem}.proof-item p{margin:6px 0 0;color:#cbd5e1;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .order-transition { position:fixed; z-index:999; inset:0; display:grid; place-items:center; opacity:0; pointer-events:none; background:linear-gradient(135deg,#7c2d12,#c2410c 52%,#ea580c); transition:opacity .25s ease; }
  .order-transition.show { opacity:1; pointer-events:auto; }
  .order-transition div { text-align:center; color:#fff; }
  .order-transition i { display:block; width:44px; height:44px; margin:0 auto 16px; border:4px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:orderTransitionSpin .7s linear infinite; }
  .order-transition strong,.order-transition small { display:block; }.order-transition small{margin-top:7px;color:#ffedd5}
  @keyframes orderTransitionSpin { to { transform:rotate(360deg); } }
  @media (max-width: 650px) {
    .lookup-pair { grid-template-columns: 1fr; }
    .split-top { min-height: 43vh; padding: 52px 16px 132px; }
    .split-title { font-size: 2.35rem; }
    .split-bottom { min-height: 57vh; padding-inline: 14px; }
    .floating-wrap { transform: translateY(-36px); }
    .single-card { padding: 19px 16px; border-radius: 20px; }
    .single-input { padding-inline: 48px 88px; font-size: 1.05rem; }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (location.pathname !== '/') return;
    if (await window.apMaintenanceGate?.()) return;
    if (!document.getElementById('portal')) return;
    document.body.classList.add('split-home-ready');
    const orderInput = document.getElementById('singleOrderNumber');
    const incomingRef=new URLSearchParams(location.search).get('ref');if(/^[A-Z0-9]{8,32}$/i.test(incomingRef||''))localStorage.setItem('advpro_referral',incomingRef.toUpperCase());
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    fetch('/api/public/reviews').then(r=>r.json()).then(data=>{if(!data.reviews?.length)return;document.getElementById('proofTrack').innerHTML=data.reviews.map(r=>'<article class="proof-item"><span class="proof-stars">★★★★★</span><strong>'+escapeHtml(r.customer_name)+'</strong><small>'+escapeHtml(r.product_name)+'</small>'+(r.comment?'<p>'+escapeHtml(r.comment)+'</p>':'')+'</article>').join('');document.getElementById('socialProof').hidden=false}).catch(()=>{});
    const message = document.getElementById('singleLookupMessage');
    const { normalizeOrderNumber } = await import('/lib/order-number.js');
    const pasteButton = document.getElementById('pasteOrderNumber');
    const clearButton = document.getElementById('clearOrderNumber');
    const updateTools = () => { clearButton.hidden = !orderInput.value; };
    orderInput.addEventListener('input', () => {
      const orderNumber = normalizeOrderNumber(orderInput.value);
      if (orderNumber && orderInput.value !== orderNumber) orderInput.value = orderNumber;
      orderInput.removeAttribute('aria-invalid');
      message.textContent = '';
      updateTools();
    });
    clearButton.addEventListener('click', () => { orderInput.value = ''; updateTools(); orderInput.focus(); message.textContent = ''; });
    pasteButton.addEventListener('click', async () => {
      try {
        if (!navigator.clipboard?.readText || !window.isSecureContext) throw new Error('clipboard-unavailable');
        const orderNumber = normalizeOrderNumber(await navigator.clipboard.readText());
        orderInput.value = orderNumber;
        updateTools();
        orderInput.removeAttribute('aria-invalid');
        message.textContent = orderNumber ? '' : 'لم نجد رقم طلب في النص المنسوخ.';
        const original = pasteButton.innerHTML;
        pasteButton.classList.add('success'); pasteButton.innerHTML = '<span>تم اللصق ✓</span>';
        setTimeout(() => { pasteButton.classList.remove('success'); pasteButton.innerHTML = original; }, 1500);
      } catch {
        orderInput.focus();
        message.textContent = 'الصق رقم الطلب يدويًا داخل الحقل.';
      }
    });
    document.getElementById('singleOrderLookup').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('.single-action');
      const orderNumber = normalizeOrderNumber(orderInput.value);
      orderInput.value = orderNumber;
      if (!orderNumber) {
        orderInput.setAttribute('aria-invalid', 'true');
        message.textContent = 'أدخل رقم الطلب بالأرقام فقط.';
        orderInput.focus();
        return;
      }
      button.disabled = true;
      button.textContent = 'جارِ التحقق…';
      message.textContent = '';
      try {
        const result = await fetch('/api/public/lookup', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ orderNumber, referralCode:localStorage.getItem('advpro_referral') || null })
        });
        const data = await result.json().catch(() => ({}));
        if (result.ok && data.redirectTo) {
          localStorage.removeItem('advpro_referral');
          var transition=document.createElement('div');transition.className='order-transition';transition.innerHTML='<div><i></i><strong>جارِ البحث عن طلبك…</strong><small>لحظات ونجهز رحلة التحقق الآمنة</small></div>';document.body.append(transition);requestAnimationFrame(function(){transition.classList.add('show')});setTimeout(function(){location.assign(data.redirectTo)},320);return;
        }
        message.textContent = result.status === 503
          ? 'خدمة الاستعلام غير متاحة مؤقتًا. يرجى المحاولة بعد قليل.'
          : data.message || 'لم يتم العثور على الطلب. تحقق من الرقم وحاول مجددًا.';
      } catch {
        message.textContent = 'تعذر الاتصال بالخدمة. حاول بعد قليل.';
      } finally {
        button.disabled = false;
        button.textContent = 'عرض بيانات الاشتراك ←';
      }
    });
  });
</script>
