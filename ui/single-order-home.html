<style>
  body.split-home-ready { background: #071a35 !important; }
  .split-home-ready .top, .split-home-ready > .footer, .split-home-ready .shell > .footer { display: none !important; }
  .split-home-ready .shell { max-width: none; padding: 0; }
  .single-home { min-height: 100vh; background: #071a35; color: #f8fafc; overflow: hidden; }
  .split-top {
    position: relative;
    min-height: 45vh;
    padding: clamp(58px, 8vh, 92px) 20px 155px;
    display: flex;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(135deg, #9a3412 0%, #c2410c 55%, #ea580c 100%);
  }
  .split-top::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .09;
    background-image: repeating-linear-gradient(135deg, #fff 0 1px, transparent 1px 32px);
  }
  .split-top::after {
    content: "";
    position: absolute;
    width: 390px;
    height: 390px;
    top: -205px;
    left: -80px;
    border: 1px solid #fff3;
    border-radius: 50%;
    box-shadow: 0 0 0 58px #ffffff08, 0 0 0 116px #ffffff06;
  }
  .split-copy { position: relative; z-index: 1; max-width: 760px; }
  .brand-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 15px;
    color: #fff;
    font-size: .78rem;
    font-weight: 800;
    border: 1px solid #ffffff38;
    border-radius: 999px;
    background: #ffffff1f;
    backdrop-filter: blur(12px);
    box-shadow: inset 0 1px #ffffff24;
  }
  .brand-pill i { font-style: normal; }
  .split-title {
    margin: 20px 0 10px;
    color: #fff;
    font-size: clamp(2.25rem, 5vw, 4.15rem);
    line-height: 1.16;
    letter-spacing: -.045em;
  }
  .split-lead { margin: 0; color: #fff; opacity: .9; font-size: clamp(.95rem, 2vw, 1.08rem); }
  .split-bottom { min-height: 55vh; padding: 0 20px 36px; background: #071a35; }
  .floating-wrap { width: min(570px, 100%); margin: 0 auto; transform: translateY(-112px); }
  .single-card {
    padding: 27px;
    border: 1px solid #1e293b;
    border-radius: 24px;
    background: #0b2142;
    box-shadow: 0 30px 85px #000a, 0 15px 35px #02061799;
  }
  .single-label {
    display: block;
    margin-bottom: 12px;
    color: #f8fafc;
    text-align: center;
    font-size: 1rem;
    font-weight: 900;
  }
  .single-label b { margin-left: 6px; color: #fb923c; font-size: 1.16rem; }
  .lookup-pair { display: grid; grid-template-columns: 1fr; gap: 12px; align-items: end; }
  .lookup-pair .single-label { display: grid; gap: 8px; }
  .lookup-pair [hidden] { display: none !important; }
  .single-input {
    width: 100%;
    height: 56px;
    padding: 0 16px;
    color: #fff;
    text-align: center;
    font-size: 1.05rem;
    border: 1px solid #1e293b;
    border-radius: 13px;
    outline: none;
    background: #06152d;
    transition: border-color .2s, box-shadow .2s;
  }
  .single-input::placeholder { color: #64748b; }
  .single-input:focus { border-color: #fb923c; box-shadow: 0 0 0 4px #fb923c20; }
  .single-input[aria-invalid="true"] { border-color: #fb7185; box-shadow: 0 0 0 4px #fb718520; }
  .single-action {
    width: 100%;
    margin-top: 14px;
    padding: 16px;
    border: 0;
    border-radius: 13px;
    color: #fff;
    font-size: .98rem;
    font-weight: 900;
    background: #c2410c;
    box-shadow: 0 12px 28px #c2410c35;
    transition: background .2s, transform .2s;
  }
  .single-action:hover { background: #ea580c; transform: translateY(-1px); }
  .single-action:disabled { cursor: wait; opacity: .7; transform: none; }
  .single-message { min-height: 18px; margin: 10px 0 0; color: #fda4af; text-align: center; font-size: .79rem; }
  .security-note {
    display: flex;
    gap: 8px;
    justify-content: center;
    align-items: flex-start;
    margin: 12px auto 0;
    color: #94a3b8;
    text-align: center;
    line-height: 1.65;
    font-size: .72rem;
  }
  .security-note i { color: #fb923c; font-style: normal; }
  .clean-footer { margin-top: 17px; text-align: center; }
  .support-line {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #94a3b8;
    font-size: .82rem;
    font-weight: 700;
    text-decoration: none;
    transition: color .2s, transform .2s;
  }
  .support-line strong { color: #22c55e; font-weight: 900; }
  .support-line svg { width: 17px; height: 17px; color: #22c55e; }
  .support-line:hover { color: #cbd5e1; transform: translateY(-1px); }
  .support-line:hover strong, .support-line:hover svg { color: #4ade80; }
  .footer-mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    margin: 15px auto 0;
  }
  .footer-mark img { width: 34px; height: 34px; object-fit: contain; display: block; }
  .copyright { margin-top: 13px; color: #64748b; font-size: .72rem; }
  .order-transition { position:fixed; z-index:999; inset:0; display:grid; place-items:center; opacity:0; pointer-events:none; background:linear-gradient(135deg,#7c2d12,#c2410c 52%,#ea580c); transition:opacity .25s ease; }
  .order-transition.show { opacity:1; pointer-events:auto; }
  .order-transition div { text-align:center; color:#fff; }
  .order-transition i { display:block; width:44px; height:44px; margin:0 auto 16px; border:4px solid #ffffff55; border-top-color:#fff; border-radius:50%; animation:orderTransitionSpin .7s linear infinite; }
  .order-transition strong,.order-transition small { display:block; }.order-transition small{margin-top:7px;color:#ffedd5}
  @keyframes orderTransitionSpin { to { transform:rotate(360deg); } }
  @media (max-width: 650px) {
    .lookup-pair { grid-template-columns: 1fr; }
    .split-top { min-height: 43vh; padding: 52px 16px 132px; }
    .split-title { font-size: 2.35rem; }
    .split-bottom { min-height: 57vh; padding-inline: 14px; }
    .floating-wrap { transform: translateY(-88px); }
    .single-card { padding: 19px 16px; border-radius: 20px; }
    .brand-pill { font-size: .68rem; }
  }
</style>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    if (location.pathname !== '/') return;
    if (await window.apMaintenanceGate?.()) return;
    const portal = document.getElementById('portal');
    if (!portal) return;
    document.body.classList.add('split-home-ready');
    portal.innerHTML = '<main class="single-home"><section class="split-top"><div class="split-copy"><h1 class="split-title">بوابة استعلام عن طلبك</h1><p class="split-lead">أدخل بيانات الطلب لعرض وتفعيل اشتراكك بأمان</p></div></section><section class="split-bottom"><div class="floating-wrap"><div class="single-card"><form id="singleOrderLookup" novalidate><div class="lookup-pair"><label class="single-label" for="singleOrderNumber"><span><b>#</b> رقم الطلب</span><input id="singleOrderNumber" class="single-input" name="orderNumber" type="text" required inputmode="numeric" pattern="[0-9]*" maxlength="30" autocomplete="off" placeholder="رقم الطلب"></label><label class="single-label compact" for="singlePhoneLast4"><span><b>••</b> آخر 4 من الجوال</span><input id="singlePhoneLast4" class="single-input" name="phoneLast4" type="text" required inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" placeholder="1234"></label></div><button class="single-action" type="submit">⌕ &nbsp; عرض بيانات الاشتراك</button><p id="singleLookupMessage" class="single-message" role="status" aria-live="polite"></p></form><div class="security-note"><i>▣</i><span>نتحقق من آخر 4 أرقام فقط لحماية طلبك، ثم نربط الاشتراك بجهازك.</span></div></div><div class="clean-footer"><a class="support-line" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent('مرحبًا، لا أجد رقم طلبي في بوابة أدفانسد برو')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 11.5a8 8 0 0 1-11.8 7L4 20l1.5-4.1A8 8 0 1 1 20 11.5Z"/></svg><span>لا تجد رقم الطلب؟</span><strong>تواصل مع الدعم</strong></a><span class="footer-mark" aria-hidden="true"><img src="/assets/bawaba-favicon.png" alt=""></span><div class="copyright">© بوابة أدفانسد برو | Advanced Pro Portal</div></div></div></section></main>';
    document.documentElement.classList.remove('split-boot');
    document.querySelector('.split-lead').textContent = 'أدخل رقم الطلب فقط لعرض وتفعيل اشتراكك فورًا';
    document.querySelector('.security-note span').textContent = 'حماية ذكية غير مرئية توقف محاولات التخمين المتكررة دون إزعاج العميل.';

    const orderInput = document.getElementById('singleOrderNumber');
    const phoneInput = document.getElementById('singlePhoneLast4');
    phoneInput.closest('label').hidden = true;
    phoneInput.value = '0000';
    const message = document.getElementById('singleLookupMessage');
    const normalizeDigits = value => String(value)
      .replace(/[٠-٩]/g, digit => String(digit.charCodeAt(0) - 1632))
      .replace(/[۰-۹]/g, digit => String(digit.charCodeAt(0) - 1776))
      .replace(/\D/g, '')
      .slice(0, 30);
    orderInput.addEventListener('input', () => {
      const digits = normalizeDigits(orderInput.value);
      if (orderInput.value !== digits) orderInput.value = digits;
      orderInput.removeAttribute('aria-invalid');
      message.textContent = '';
    });
    phoneInput.addEventListener('input', () => {
      const digits = normalizeDigits(phoneInput.value).slice(0, 4);
      if (phoneInput.value !== digits) phoneInput.value = digits;
      phoneInput.removeAttribute('aria-invalid');
      message.textContent = '';
    });

    document.getElementById('singleOrderLookup').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const orderNumber = normalizeDigits(orderInput.value);
      const phoneLast4 = normalizeDigits(phoneInput.value).slice(0, 4);
      orderInput.value = orderNumber;
      phoneInput.value = phoneLast4;
      if (!orderNumber) {
        orderInput.setAttribute('aria-invalid', 'true');
        message.textContent = 'أدخل رقم الطلب بالأرقام فقط.';
        orderInput.focus();
        return;
      }
      if (!/^\d{4}$/.test(phoneLast4)) {
        phoneInput.setAttribute('aria-invalid', 'true');
        message.textContent = 'أدخل آخر 4 أرقام من رقم الجوال.';
        phoneInput.focus();
        return;
      }
      button.disabled = true;
      button.textContent = 'جارِ التحقق…';
      message.textContent = '';
      try {
        const result = await fetch('/api/public/lookup', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ orderNumber, phoneLast4 })
        });
        const data = await result.json().catch(() => ({}));
        if (result.ok && data.redirectTo) {
          var transition=document.createElement('div');transition.className='order-transition';transition.innerHTML='<div><i></i><strong>تم العثور على طلبك</strong><small>جارِ فتح تفاصيل الاشتراك بأمان…</small></div>';document.body.append(transition);requestAnimationFrame(function(){transition.classList.add('show')});setTimeout(function(){location.assign(data.redirectTo)},320);return;
        }
        message.textContent = result.status === 503
          ? 'خدمة الاستعلام غير متاحة مؤقتًا. يرجى المحاولة بعد قليل.'
          : data.message || 'لم يتم العثور على الطلب. تحقق من الرقم وحاول مجددًا.';
      } catch {
        message.textContent = 'تعذر الاتصال بالخدمة. حاول بعد قليل.';
      } finally {
        button.disabled = false;
        button.textContent = '⌕  عرض بيانات الاشتراك';
      }
    });
  });
</script>
